<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Builder - Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .pending { background: #fff3cd; border-color: #ffeaa7; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>🔧 Pipeline Builder Diagnostic Test</h1>
    <p>This page tests if all Pipeline Builder components are loading correctly.</p>

    <div id="test-results"></div>

    <h2>Manual Tests</h2>
    <button onclick="testTemplateLoading()">Test Template Loading</button>
    <button onclick="testAPI()">Test API Connection</button>
    <button onclick="window.location.href='/pipeline-builder.html'">Go to Pipeline Builder</button>

    <div id="manual-results"></div>

    <!-- Load Pipeline Builder scripts in order -->
    <script src="/js/pipeline/models/PipelineModels.js"></script>
    <script src="/js/pipeline/services/PipelineAPIService.js"></script>
    <script src="/js/pipeline/managers/DragDropManager.js"></script>
    <script src="/js/pipeline/managers/CanvasRenderer.js"></script>
    <script src="/js/pipeline/managers/StepNodeManager.js"></script>
    <script src="/js/pipeline/managers/ToolboxManager.js"></script>
    <script src="/js/pipeline/managers/PropertiesPanel.js"></script>
    <script src="/js/pipeline/documentation/StepDocumentationRegistry.js"></script>
    <script src="/js/pipeline/documentation/CDAStepsDocs.js"></script>
    <script src="/js/pipeline/documentation/FormatBuilderStepsDocs.js"></script>
    <script src="/js/pipeline/documentation/PreProcessingStepsDocs.js"></script>
    <script src="/js/pipeline/documentation/EnrichmentStepsDocs.js"></script>
    <script src="/js/pipeline/documentation/PostProcessingStepsDocs.js"></script>
    <script src="/js/pipeline/documentation/ControlFlowStepsDocs.js"></script>
    <script src="/js/pipeline/documentation/CoreMappingStepsDocs.js"></script>
    <script src="/js/pipeline/documentation/ConnectorStepsDocs.js"></script>
    <script src="/js/pipeline/documentation/TransformMiscStepsDocs.js"></script>
    <script src="/js/pipeline/managers/LayerContainer.js"></script>
    <script src="/js/pipeline/PipelineBuilder.js"></script>

    <script>
        const resultsDiv = document.getElementById('test-results');
        const manualDiv = document.getElementById('manual-results');

        // Auto-run tests on load
        window.addEventListener('load', function() {
            runAllTests();
        });

        function addResult(title, success, message) {
            const div = document.createElement('div');
            div.className = `test-section ${success ? 'success' : 'error'}`;
            div.innerHTML = `
                <h3>${success ? '✅' : '❌'} ${title}</h3>
                <p>${message}</p>
            `;
            resultsDiv.appendChild(div);
        }

        function runAllTests() {
            resultsDiv.innerHTML = '<h2>Running Tests...</h2>';

            // Test 1: Check if classes are defined
            const classes = [
                'VisualPipeline',
                'VisualLayer',
                'VisualExecutionGroup',
                'VisualStep',
                'StepTemplate',
                'PipelineAPIService',
                'DragDropManager',
                'CanvasRenderer',
                'StepNodeManager',
                'ToolboxManager',
                'PropertiesPanel',
                'LayerContainer',
                'PipelineBuilder'
            ];

            let allClassesLoaded = true;
            let missingClasses = [];

            classes.forEach(className => {
                if (typeof window[className] === 'undefined') {
                    allClassesLoaded = false;
                    missingClasses.push(className);
                }
            });

            if (allClassesLoaded) {
                addResult('JavaScript Classes', true, 'All 13 classes loaded successfully');
            } else {
                addResult('JavaScript Classes', false, `Missing classes: ${missingClasses.join(', ')}`);
                return; // Stop further tests
            }

            // Test 2: Create StepTemplate instance
            try {
                const template = new StepTemplate({
                    id: 'test-template',
                    name: 'Test Template',
                    type: 'test',
                    isSystem: true
                });

                if (template.id === 'test-template' && template.name === 'Test Template') {
                    addResult('StepTemplate Creation', true, 'Can create template instances');
                } else {
                    addResult('StepTemplate Creation', false, 'Template properties not set correctly');
                }
            } catch (error) {
                addResult('StepTemplate Creation', false, error.message);
            }

            // Test 3: Create VisualPipeline instance
            try {
                const pipeline = new VisualPipeline({
                    interfaceId: 'TEST_001',
                    messageType: 'ADT^A01',
                    name: 'Test Pipeline'
                });

                if (pipeline.interfaceId === 'TEST_001') {
                    addResult('VisualPipeline Creation', true, 'Can create pipeline instances');
                } else {
                    addResult('VisualPipeline Creation', false, 'Pipeline properties not set correctly');
                }
            } catch (error) {
                addResult('VisualPipeline Creation', false, error.message);
            }

            // Test 4: Check PipelineAPIService
            try {
                const api = new PipelineAPIService();
                if (api.baseURL === '/api') {
                    addResult('PipelineAPIService', true, 'API service initialized correctly');
                } else {
                    addResult('PipelineAPIService', false, 'API base URL incorrect');
                }
            } catch (error) {
                addResult('PipelineAPIService', false, error.message);
            }

            // Test 5: Test built-in templates
            testTemplateLoadingInternal();
        }

        function testTemplateLoadingInternal() {
            try {
                // Simulate what ToolboxManager does
                const templates = [
                    new StepTemplate({
                        id: 'validate-required-fields',
                        name: 'Validate Required Fields',
                        type: 'pre.validation',
                        description: 'Validates required HL7 fields',
                        layer: 'pre',
                        icon: 'fas fa-check-circle',
                        isSystem: true,
                        defaultConfig: {
                            rules: [
                                { field: 'MSH.9', required: true },
                                { field: 'PID.3', required: true }
                            ]
                        }
                    }),
                    new StepTemplate({
                        id: 'hl7-fhir-mapping',
                        name: 'HL7 to FHIR Mapping',
                        type: 'core.mapping',
                        description: 'Transform HL7 to FHIR R4',
                        layer: 'core',
                        icon: 'fas fa-exchange-alt',
                        isSystem: true,
                        defaultConfig: {
                            fhir_version: 'R4',
                            use_template: true
                        }
                    })
                ];

                const systemTemplates = templates.filter(t => t.isSystem);

                if (systemTemplates.length === 2) {
                    addResult('Template Filtering', true, `Found ${systemTemplates.length} system templates`);
                } else {
                    addResult('Template Filtering', false, `Expected 2 system templates, found ${systemTemplates.length}`);
                }
            } catch (error) {
                addResult('Template Loading', false, error.message);
            }
        }

        function testTemplateLoading() {
            manualDiv.innerHTML = '<div class="test-section pending"><h3>Testing Template Loading...</h3></div>';

            try {
                const mockBuilder = {
                    dragDropManager: {
                        makeDraggable: () => {}
                    }
                };

                // This would normally be done by ToolboxManager
                const template = new StepTemplate({
                    id: 'test',
                    name: 'Test Template',
                    isSystem: true,
                    icon: 'fas fa-test'
                });

                const step = template.createStep();

                manualDiv.innerHTML = `
                    <div class="test-section success">
                        <h3>✅ Template Loading Successful</h3>
                        <p>Created template: ${template.name}</p>
                        <p>Created step from template: ${step.stepName}</p>
                        <pre>${JSON.stringify(step, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                manualDiv.innerHTML = `
                    <div class="test-section error">
                        <h3>❌ Template Loading Failed</h3>
                        <p>${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }

        async function testAPI() {
            manualDiv.innerHTML = '<div class="test-section pending"><h3>Testing API Connection...</h3></div>';

            try {
                const response = await fetch('/api/templates');
                const data = await response.json();

                manualDiv.innerHTML = `
                    <div class="test-section ${response.ok ? 'success' : 'error'}">
                        <h3>${response.ok ? '✅' : '❌'} API Connection</h3>
                        <p>Status: ${response.status} ${response.statusText}</p>
                        <p>Response:</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                manualDiv.innerHTML = `
                    <div class="test-section error">
                        <h3>❌ API Connection Failed</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
    <script src="/js/ai-assistant.js"></script>
</body>
</html>
