<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Pipeline Builder - ezHealthKonnect</title>
    <link rel="stylesheet" href="/css/pipeline-builder.css?v=11.0">
    <link rel="stylesheet" href="/css/components/field-path-autocomplete.css">
    <link rel="stylesheet" href="/css/api-endpoint-tester.css">
    <link rel="stylesheet" href="/css/result-mapping-builder.css?v=1.0">
    <link rel="stylesheet" href="/css/database-query-tester.css?v=1.0">
    <!-- NO-CODE Variable System -->
    <link rel="stylesheet" href="/css/variable-panel.css?v=2.0">
    <link rel="stylesheet" href="/css/script-enrichment-editor.css?v=2.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="pipeline-header">
        <div class="header-left">
            <button id="backBtn" class="btn-icon" title="Back to Interfaces">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 id="pipelineTitle">Pipeline Builder</h1>
            <span id="interfaceInfo" class="interface-badge"></span>
        </div>
        <div class="header-center">
            <div class="pipeline-status">
                <span id="autoSaveStatus" class="status-indicator"></span>
            </div>
        </div>
        <div class="header-right">
            <button id="pipelineSettingsBtn" class="btn btn-secondary" title="Pipeline Settings">
                <i class="fas fa-cog"></i> Settings
            </button>
            <button id="testPipelineBtn" class="btn btn-secondary">
                <i class="fas fa-flask"></i> Test
            </button>
            <button id="savePipelineBtn" class="btn btn-primary">
                <i class="fas fa-save"></i> Save Pipeline
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="pipeline-container">

        <!-- Left Panel: Toolbox -->
        <aside class="toolbox-panel">
            <div class="panel-header">
                <h2><i class="fas fa-toolbox"></i> Components</h2>
                <input type="text" id="toolboxSearch" class="search-input" placeholder="Search steps...">
            </div>

            <div class="toolbox-content">
                <!-- Template Library -->
                <div class="toolbox-section">
                    <h3 class="section-title">
                        <i class="fas fa-star"></i> Templates
                        <button class="section-toggle" data-target="templates-list">
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </h3>
                    <div id="templates-list" class="section-content">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- All Steps -->
                <div class="toolbox-section">
                    <h3 class="section-title">
                        <i class="fas fa-th-list"></i> All Steps
                        <button class="section-toggle" data-target="all-steps-list">
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </h3>
                    <div id="all-steps-list" class="section-content">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- Custom Scripts -->
                <div class="toolbox-section">
                    <h3 class="section-title">
                        <i class="fas fa-code"></i> Custom Scripts
                        <button class="section-toggle" data-target="custom-steps-list">
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </h3>
                    <div id="custom-steps-list" class="section-content">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center: Canvas Area -->
        <main class="canvas-area">
            <div class="canvas-toolbar">
                <div class="toolbar-left">
                    <button id="zoomInBtn" class="btn-icon" title="Zoom In">
                        <i class="fas fa-search-plus"></i>
                    </button>
                    <button id="zoomOutBtn" class="btn-icon" title="Zoom Out">
                        <i class="fas fa-search-minus"></i>
                    </button>
                    <button id="zoomResetBtn" class="btn-icon" title="Reset Zoom">
                        <i class="fas fa-compress"></i>
                    </button>
                    <span id="zoomLevel" class="zoom-level">100%</span>
                </div>
                <div class="toolbar-center">
                    <!-- View Mode: Flowchart Only -->
                    <div class="view-mode-toggle">
                        <button id="flowchartViewBtn" class="view-mode-btn active" data-view="flowchart">
                            <i class="fas fa-project-diagram"></i> Flowchart
                        </button>
                    </div>
                </div>
                <div class="toolbar-right">
                    <button id="connectModeBtn" class="btn-icon" title="Connect Mode: Click step 1, then step 2 to create arrow">
                        <i class="fas fa-link"></i>
                    </button>
                    <button id="zoomLockBtn" class="btn-icon" title="Lock Zoom (Ctrl+L)">
                        <i class="fas fa-lock-open"></i>
                    </button>
                    <button id="autoLayoutBtn" class="btn-icon" title="Auto Layout">
                        <i class="fas fa-magic"></i>
                    </button>
                    <button id="autoSequenceBtn" class="btn-icon" title="Preview Sequences (runs auto on save)">
                        <i class="fas fa-sort-numeric-down"></i>
                    </button>
                    <button id="clearCanvasBtn" class="btn-icon" title="Clear Canvas">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <!-- Canvas with Layers -->
            <div class="canvas-wrapper" id="canvasWrapper">
                <svg id="connectionsSvg" class="connections-layer"></svg>

                <div class="canvas-layers" id="canvasLayers">
                    <!-- Unified Pipeline Canvas -->
                    <div class="canvas-drop-zone" id="canvasDropZone" data-layer="core">
                        <div class="drop-zone-placeholder">
                            <i class="fas fa-project-diagram"></i>
                            <p>Drag steps here to build your pipeline</p>
                            <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem;">Steps execute in sequence order from top to bottom</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Panel: Properties (HIDDEN - Using modal instead) -->
        <aside class="properties-panel" style="display: none;">
            <div class="panel-header">
                <h2><i class="fas fa-cog"></i> Properties</h2>
            </div>

            <div id="propertiesContent" class="properties-content">
                <div class="no-selection-message">
                    <i class="fas fa-mouse-pointer"></i>
                    <p>Select a step to configure its properties</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Modal: Step Properties -->
    <div id="stepPropertiesModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 900px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column;">
            <div class="modal-header" style="background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); color: white; border-radius: 8px 8px 0 0;">
                <h3><i class="fas fa-cog"></i> <span id="stepModalTitle">Step Configuration</span></h3>
                <div class="modal-header-actions">
                    <button class="modal-fullscreen-btn" title="Toggle Fullscreen" style="background: transparent; border: none; color: white; font-size: 18px; cursor: pointer; padding: 8px 12px; margin-right: 8px; transition: all 0.2s;">
                        <i class="fas fa-expand"></i>
                    </button>
                    <button class="modal-close" style="color: white;">&times;</button>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="modal-tabs" style="display: flex; background: #f3f4f6; border-bottom: 2px solid #e5e7eb; padding: 0;">
                <button class="modal-tab active" data-tab="form" style="flex: 1; padding: 12px 20px; border: none; background: white; border-bottom: 3px solid #2563eb; cursor: pointer; font-weight: 500; color: #1e3a8a; transition: all 0.3s;">
                    <i class="fas fa-sliders-h"></i> Configuration
                </button>
                <button class="modal-tab" data-tab="variables" style="flex: 1; padding: 12px 20px; border: none; background: transparent; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 500; color: #6b7280; transition: all 0.3s;">
                    <i class="fas fa-database"></i> Variables
                </button>
                <button class="modal-tab" data-tab="json" style="flex: 1; padding: 12px 20px; border: none; background: transparent; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 500; color: #6b7280; transition: all 0.3s;">
                    <i class="fas fa-file-upload"></i> Import JSON
                </button>
                <button class="modal-tab" data-tab="docs" style="flex: 1; padding: 12px 20px; border: none; background: transparent; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 500; color: #6b7280; transition: all 0.3s;">
                    <i class="fas fa-book"></i> Documentation
                </button>
            </div>

            <div class="modal-body" style="flex: 1; overflow-y: auto; padding: 1.5rem;">
                <!-- Form Tab Content -->
                <div id="formTabContent" class="tab-content active">
                    <!-- Dynamic form UI loaded here -->
                </div>

                <!-- Variables Tab Content -->
                <div id="variablesTabContent" class="tab-content" style="display: none; padding: 0; height: 100%;">
                    <!-- Reference variables panel loaded here -->
                </div>

                <!-- JSON Tab Content -->
                <div id="jsonTabContent" class="tab-content" style="display: none;">
                    <!-- Dynamic JSON editor loaded here -->
                </div>

                <!-- Documentation Tab Content -->
                <div id="docsTabContent" class="tab-content" style="display: none;">
                    <!-- Dynamic documentation loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Test Pipeline -->
    <div id="testModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-flask"></i> Test Pipeline</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Sample Message (HL7)</label>
                    <textarea id="testMessageInput" rows="10" placeholder="Paste HL7 message here..."></textarea>
                </div>
                <div class="test-results" id="testResults" style="display: none;">
                    <h4>Execution Results</h4>
                    <div id="testResultsContent"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="runTestBtn" class="btn btn-primary">
                    <i class="fas fa-play"></i> Run Test
                </button>
                <button class="btn btn-secondary modal-close">Close</button>
            </div>
        </div>
    </div>

    <!-- Authentication Service (OOB) -->
    <script src="/js/services/AuthService.js"></script>

    <!-- JavaScript Dependencies -->
    <script src="/js/pipeline/models/PipelineModels.js?v=7.0"></script>
    <script src="/js/pipeline/services/PipelineAPIService.js?v=5.0"></script>
    <script src="/js/pipeline/managers/DragDropManager.js?v=5.0"></script>
    <script src="/js/pipeline/managers/CanvasRenderer.js?v=4.0"></script>
    <script src="/js/pipeline/managers/StepNodeManager.js?v=6.0"></script>
    <script src="/js/pipeline/managers/ToolboxManager.js?v=9.0"></script>
    <script src="/js/pipeline/managers/PropertiesPanel.js?v=27.0"></script>
    <!-- Modular OOP Components -->
    <script src="/js/pipeline/components/FieldPathSearchComponent.js?v=2.3"></script>
    <script src="/js/pipeline/components/FieldPathInputWithAutocomplete.js?v=2.4"></script>
    <script src="/js/pipeline/components/ValidationRuleBuilder.js?v=12.0"></script>
    <script src="/js/pipeline/components/MetadataBuilder.js?v=1.1"></script>
    <script src="/js/pipeline/components/HeaderBuilder.js?v=1.0"></script>
    <script src="/js/pipeline/components/QueryParamBuilder.js?v=1.3"></script>
    <script src="/js/pipeline/components/ResultMappingBuilder.js?v=2.0"></script>
    <script src="/js/pipeline/components/DatabaseQueryTester.js?v=1.6"></script>
    <script src="/js/pipeline/components/MongoDBFilterBuilder.js?v=1.0"></script>
    <script src="/js/pipeline/components/MongoDBProjectionBuilder.js?v=1.0"></script>
    <script src="/js/pipeline/components/RedisQueryBuilder.js?v=1.4"></script>
    <script src="/js/pipeline/components/OAuth2ConfigBuilder.js?v=1.0"></script>
    <script src="/js/pipeline/components/APIEndpointTester.js?v=1.1"></script>
    <!-- OOP Base Classes and Utilities (must load before OOP components) -->
    <script src="/js/pipeline/utils/ConfigUtils.js?v=1.0"></script>
    <script src="/js/pipeline/utils/DOMUtils.js?v=1.0"></script>
    <script src="/js/pipeline/utils/TransformUtils.js?v=1.0"></script>
    <script src="/js/pipeline/utils/StepVariablesProvider.js?v=1.0"></script>
    <script src="/js/pipeline/components/BaseStepConfigBuilder.js?v=1.0"></script>
    <!-- Conditional Logic Builders (must load before PropertiesPanel uses them) -->
    <script src="/js/pipeline/utils/IfThenElseActionTranslator.js?v=1.0"></script>
    <script src="/js/pipeline/components/IfThenElseBuilder.js?v=3.1"></script>
    <script src="/js/pipeline/components/SwitchCaseBuilder.js?v=2.5"></script>
    <!-- Loop Type Providers (OOP pattern for format-specific loop options) -->
    <!-- @see docs/LOOP_TYPE_PROVIDERS.md for architecture documentation -->
    <script src="/js/pipeline/utils/loopProviders/BaseLoopTypeProvider.js?v=1.0"></script>
    <script src="/js/pipeline/utils/loopProviders/HL7LoopProvider.js?v=1.0"></script>
    <script src="/js/pipeline/utils/loopProviders/FHIRLoopProvider.js?v=1.0"></script>
    <script src="/js/pipeline/utils/loopProviders/LoopTypeRegistry.js?v=1.0"></script>
    <script src="/js/pipeline/components/ForEachLoopBuilder.js?v=1.4"></script>
    <!-- Connector Config Builder (OOP, extends BaseStepConfigBuilder) -->
    <script src="/js/pipeline/components/ConnectorConfigBuilder.js?v=1.0"></script>
    <!-- Variables Cache (must load before ReferenceVariablesPanel) -->
    <script src="/js/pipeline/utils/VariablesCache.js?v=1.0"></script>
    <script src="/js/pipeline/components/ReferenceVariablesPanel.js?v=3.5"></script>
    <!-- NO-CODE Variable System (must load before PropertiesPanel uses it) -->
    <script src="/js/pipeline/components/VariablePanelBuilder.js?v=2.0"></script>
    <script src="/js/pipeline/components/ScriptEnrichmentEditor.js?v=2.5"></script>
    <!-- Flowchart Mode Components - V1 (Legacy) -->
    <script src="/js/pipeline/utils/FlowchartLayoutEngine.js?v=2.0"></script>
    <script src="/js/pipeline/utils/FlowchartConnector.js?v=2.0"></script>
    <script src="/js/pipeline/managers/FlowchartRenderer.js?v=2.0"></script>
    <!-- Flowchart Mode Components - V2 (New Horizontal Layout) -->
    <script src="/js/pipeline/flowchart-v2/core/CoordinateSystem.js?v=1.0"></script>
    <script src="/js/pipeline/flowchart-v2/layout/HorizontalLayoutEngine.js?v=2.0"></script>
    <script src="/js/pipeline/flowchart-v2/rendering/FlowchartCanvas.js?v=2.0"></script>
    <script src="/js/pipeline/flowchart-v2/FlowchartOrchestratorV2.js?v=2.0"></script>
    <!-- Pipeline Core -->
    <script src="/js/pipeline/managers/LayerContainer.js?v=5.0"></script>
    <script src="/js/pipeline/PipelineBuilder.js?v=13.0"></script>
    <script src="/js/pipeline/init.js?v=9.0"></script>
</body>
</html>
