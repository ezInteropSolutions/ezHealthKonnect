<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Metrics – ezHealthKonnect</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ── Design tokens (same palette as monitoring.html) ─────────────────── */
        :root {
            --pink:        #db2777;
            --pink-dark:   #9d174d;
            --pink-light:  #fce7f3;
            --pink-mid:    #f9a8d4;
            --navy:        #1e3a8a;
            --navy-light:  #eff6ff;
            --white:       #ffffff;
            --page-bg:     #ffffff;
            --card-border: #f0e4ef;
            --text:        #1a202c;
            --muted:       #6b7280;
        }

        body { background: var(--page-bg); }
        .main-content {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
            background: var(--page-bg);
        }

        .page-header {
            padding: 20px 28px 16px;
            background: var(--white);
            border-bottom: 1px solid var(--card-border);
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        .page-header h1 { font-size: 18px; font-weight: 700; color: var(--text); }
        .page-header h1 i { color: var(--pink); margin-right: 8px; }
        .page-header p  { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .refresh-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 16px; border-radius: 20px;
            background: var(--pink-light); color: var(--pink); border: none;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s;
        }
        .refresh-btn:hover { background: #f9d4e9; }
        .auto-badge {
            font-size: 11px; padding: 3px 10px; border-radius: 10px;
            background: #dcfce7; color: #166534; font-weight: 600; letter-spacing: .03em;
        }
        .last-updated { font-size: 12px; color: #a0aec0; }

        .metrics-body {
            flex: 1; overflow-y: auto; padding: 20px 28px 32px;
            display: flex; flex-direction: column; gap: 24px;
        }

        .section-bar { margin-bottom: 10px; }
        .section-bar h2 { font-size: 13px; font-weight: 700; color: var(--text); }

        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
        }
        .kpi-card {
            background: var(--white);
            border: 1px solid var(--card-border);
            border-left: 3px solid transparent;
            border-radius: 12px; padding: 18px;
            display: flex; flex-direction: column; gap: 8px;
            text-decoration: none;
        }
        .kpi-card.status-ok       { border-left-color: #86efac; }
        .kpi-card.status-warning  { border-left-color: #fbbf24; }
        .kpi-card.status-critical { border-left-color: #f87171; }
        .kpi-card.clickable { cursor: pointer; transition: box-shadow .15s, transform .1s; }
        .kpi-card.clickable:hover { box-shadow: 0 3px 14px rgba(0,0,0,.08); transform: translateY(-1px); }

        .status-pill {
            align-self: flex-start;
            font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 10px;
            text-transform: uppercase; letter-spacing: .04em;
        }
        .status-pill.ok       { background: #dcfce7; color: #166534; }
        .status-pill.warning  { background: #fef3c7; color: #92400e; }
        .status-pill.critical { background: #fee2e2; color: #991b1b; }

        .kpi-drilldown {
            font-size: 11px; color: var(--pink); font-weight: 600;
            display: flex; align-items: center; gap: 5px;
        }
        .kpi-header { display: flex; align-items: center; justify-content: space-between; }
        .kpi-label {
            font-size: 11px; font-weight: 700; color: var(--muted);
            text-transform: uppercase; letter-spacing: .05em;
        }
        .kpi-icon {
            width: 26px; height: 26px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; font-size: 13px;
        }
        .kpi-icon.pink  { color: var(--pink-mid); }
        .kpi-icon.rose  { color: #fca5a5; }
        .kpi-icon.green { color: #86efac; }
        .kpi-icon.amber { color: #fcd34d; }

        .kpi-value { font-size: 28px; font-weight: 800; color: var(--text); line-height: 1; }
        .kpi-sub   { font-size: 11px; color: var(--muted); word-break: break-word; }

        .empty { padding: 48px 24px; text-align: center; color: #a0aec0; }
        .empty i { font-size: 30px; margin-bottom: 10px; display: block; }
        .empty p { font-size: 13px; }
        .empty.error i, .empty.error strong { color: #dc2626; }
    </style>
</head>
<body>
<div class="dashboard-container">

<nav class="sidebar" id="sidebar"></nav>

<div class="main-content">

    <div class="page-header">
        <div>
            <h1><i class="fas fa-chart-line"></i>Engine Metrics</h1>
            <p>Live engine-internal counters and gauges — pipeline throughput, latency, queue depth, and reliability</p>
        </div>
        <div class="header-actions">
            <span class="auto-badge">LIVE · 30s</span>
            <span class="last-updated" id="lastUpdated">Loading…</span>
            <button class="refresh-btn" id="refreshBtn"><i class="fas fa-rotate"></i> Refresh Now</button>
        </div>
    </div>

    <div class="metrics-body" id="metricsBody">
        <div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading engine metrics...</p></div>
    </div>
</div>

</div><!-- /dashboard-container -->

<script src="/js/core/app-dialogs.js"></script>
<script src="/js/services/AuthService.js"></script>
<script src="js/components/sidebar-nav.js?v=3"></script>
<script>
let refreshTimer;

document.addEventListener('DOMContentLoaded', async () => {
    const ok = await window.AuthService.initialize();
    if (!ok) return;

    loadMetrics();
    scheduleRefresh();

    document.getElementById('refreshBtn').addEventListener('click', () => {
        clearTimeout(refreshTimer);
        loadMetrics();
        scheduleRefresh();
    });
});

function scheduleRefresh() {
    refreshTimer = setTimeout(() => { loadMetrics(); scheduleRefresh(); }, 30000);
}

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
}

const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 }));
const fmtMs = (n) => (n == null ? '—' : Number(n).toLocaleString(undefined, { maximumFractionDigits: 1 }) + ' ms');

function breakdownText(obj) {
    const entries = Object.entries(obj || {}).filter(([, v]) => v > 0);
    if (!entries.length) return 'No breakdown data yet';
    return entries.map(([k, v]) => `${esc(k)}: ${fmt(v)}`).join(' · ');
}

// opts: { label, icon, iconColor, value, sub, status, href, drilldown }
// status: 'ok' | 'warning' | 'critical' (omit for cards with no meaningful threshold)
// href: if set, the whole card becomes a link to the page where you'd fix the problem
// drilldown: short "go here" text naming the specific worst-offending resource
function kpiCard(opts) {
    const { label, icon, iconColor, value, sub, status, href, drilldown } = opts;
    const tag = href ? 'a' : 'div';
    const hrefAttr = href ? ` href="${esc(href)}"` : '';
    const statusClass = status ? ` status-${status}` : '';
    const clickableClass = href ? ' clickable' : '';
    const statusPill = status ? `<span class="status-pill ${status}">${esc(status)}</span>` : '';
    const drilldownHtml = drilldown
        ? `<div class="kpi-drilldown"><i class="fas fa-arrow-right"></i> ${drilldown}</div>` : '';

    return `
        <${tag} class="kpi-card${statusClass}${clickableClass}"${hrefAttr}>
            <div class="kpi-header">
                <span class="kpi-label">${esc(label)}</span>
                <span class="kpi-icon ${iconColor}"><i class="${icon}"></i></span>
            </div>
            <div class="kpi-value">${esc(value)}</div>
            <div class="kpi-sub">${sub || ''}</div>
            ${drilldownHtml}
            ${statusPill}
        </${tag}>`;
}

function sectionBlock(title, cardsHtml) {
    return `
        <div>
            <div class="section-bar"><h2>${esc(title)}</h2></div>
            <div class="kpi-row">${cardsHtml}</div>
        </div>`;
}

async function loadMetrics() {
    const body = document.getElementById('metricsBody');
    try {
        const res = await fetch('/api/system/engine-metrics', { credentials: 'include' });
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Unknown error');

        const t = data.throughput || {};
        const l = data.latency || {};
        const q = data.queue || {};
        const r = data.reliability || {};
        const cap = data.capacity || {};

        const throughputCards =
            kpiCard({ label: 'Messages Received', icon: 'fas fa-inbox', iconColor: 'pink', value: fmt(t.messages_received_total) }) +
            kpiCard({
                label: 'Messages Processed', icon: 'fas fa-check-double', iconColor: 'green',
                value: fmt(t.messages_processed_total), sub: breakdownText(t.messages_processed_by_status),
                status: t.status,
                href: t.worst_failing_interface_id ? `messages.html?interfaceId=${encodeURIComponent(t.worst_failing_interface_id)}` : undefined,
                drilldown: t.worst_failing_interface_name
                    ? `${fmt(t.worst_failing_count)} failed on <strong>${esc(t.worst_failing_interface_name)}</strong> — view messages`
                    : undefined,
            }) +
            kpiCard({ label: 'Step Executions', icon: 'fas fa-diagram-project', iconColor: 'pink', value: fmt(t.step_executions_total) });

        const latencyCards =
            kpiCard({ label: 'Avg Processing Time', icon: 'fas fa-gauge', iconColor: 'amber', value: fmtMs(l.avg_processing_duration_ms), status: l.avg_processing_status }) +
            kpiCard({ label: 'Avg Step Time', icon: 'fas fa-stopwatch', iconColor: 'amber', value: fmtMs(l.avg_step_duration_ms), status: l.avg_step_status }) +
            kpiCard({ label: 'Avg Queue Wait', icon: 'fas fa-hourglass-half', iconColor: 'amber', value: fmtMs(l.avg_queue_wait_duration_ms), status: l.avg_queue_wait_status });

        const queueCards =
            kpiCard({
                label: 'Worker Queue Depth', icon: 'fas fa-layer-group', iconColor: 'pink',
                value: fmt(q.worker_queue_depth_total), status: q.worker_queue_status,
                href: q.worst_interface_id ? `messages.html?interfaceId=${encodeURIComponent(q.worst_interface_id)}` : undefined,
                drilldown: q.worst_interface_name
                    ? `Worst: <strong>${esc(q.worst_interface_name)}</strong> (${fmt(q.worst_interface_depth)}) — view messages`
                    : undefined,
            }) +
            kpiCard({ label: 'Active Interfaces', icon: 'fas fa-plug', iconColor: 'green', value: fmt(q.active_interfaces), href: 'interfaces.html' });

        const breakersDrilldown = (r.circuit_breakers_open_detail || []).length
            ? r.circuit_breakers_open_detail.slice(0, 2).map((d) =>
                  `<strong>${esc(d.step_type || d.step_id)}</strong> on ${esc(d.interface_name || 'unknown interface')}`
              ).join(', ') + (r.circuit_breakers_open_detail.length > 2 ? ` +${r.circuit_breakers_open_detail.length - 2} more` : '')
            : (r.circuit_breakers_half_open > 0 ? `${fmt(r.circuit_breakers_half_open)} half-open — watch closely` : undefined);
        const reliabilityCards =
            kpiCard({
                label: 'DLQ Enqueued (Total)', icon: 'fas fa-triangle-exclamation', iconColor: 'rose',
                value: fmt(r.dlq_enqueued_total), href: 'admin-dlq.html',
            }) +
            kpiCard({
                label: 'DLQ Depth (Current)', icon: 'fas fa-box-archive', iconColor: 'rose',
                value: fmt(r.dlq_depth), status: r.dlq_depth_status, href: 'admin-dlq.html',
                drilldown: r.dlq_depth > 0 ? 'View and reprocess dead-letter queue' : undefined,
            }) +
            kpiCard({ label: 'Recovery Requeued', icon: 'fas fa-rotate-right', iconColor: 'pink', value: fmt(r.recovery_messages_requeued_total) }) +
            kpiCard({
                label: 'Circuit Breakers Open', icon: 'fas fa-bolt', iconColor: r.circuit_breakers_open > 0 ? 'rose' : 'green',
                value: fmt(r.circuit_breakers_open), status: r.circuit_breakers_status, drilldown: breakersDrilldown,
            });

        const capacityCards =
            kpiCard({
                label: 'Active Connectors', icon: 'fas fa-network-wired', iconColor: 'green',
                value: fmt(cap.active_connectors_total), sub: breakdownText(cap.active_connectors_by_type),
                href: 'interfaces.html',
            });

        body.innerHTML =
            sectionBlock('Throughput', throughputCards) +
            sectionBlock('Latency', latencyCards) +
            sectionBlock('Queue & Backpressure', queueCards) +
            sectionBlock('Reliability', reliabilityCards) +
            sectionBlock('Capacity', capacityCards);

        document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (err) {
        body.innerHTML = `<div class="empty error"><i class="fas fa-triangle-exclamation"></i><p><strong>Could not load engine metrics.</strong><br>${esc(err.message)}</p></div>`;
        document.getElementById('lastUpdated').textContent = 'Update failed';
    }
}
</script>
</body>
</html>
