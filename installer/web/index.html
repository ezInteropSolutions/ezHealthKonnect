<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ezHealthKonnect Setup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --border:    #30363d;
    --cyan:      #22d3ee;
    --cyan-dim:  #0e7490;
    --green:     #22c55e;
    --red:       #ef4444;
    --yellow:    #f59e0b;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --sidebar-w: 240px;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Sidebar ────────────────────────────────────────────────────────────── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 32px 0;
    flex-shrink: 0;
  }

  .logo {
    padding: 0 24px 32px;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    font-size: 22px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: -0.5px;
  }
  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .steps {
    list-style: none;
    padding: 24px 0;
    flex: 1;
  }

  .step-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    cursor: default;
    transition: background 0.15s;
  }

  .step-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .step-label {
    font-size: 13px;
    color: var(--muted);
    transition: color 0.2s;
  }

  .step-item.active .step-dot {
    border-color: var(--cyan);
    background: var(--cyan);
    color: #000;
  }
  .step-item.active .step-label {
    color: var(--text);
    font-weight: 500;
  }
  .step-item.done .step-dot {
    border-color: var(--green);
    background: var(--green);
    color: #000;
  }
  .step-item.done .step-label { color: var(--muted); }

  .sidebar-footer {
    padding: 24px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Main content ────────────────────────────────────────────────────────── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header p  { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 40px;
  }

  .footer {
    padding: 20px 40px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }

  /* ── Buttons ─────────────────────────────────────────────────────────────── */
  .btn {
    padding: 9px 22px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: opacity 0.15s, background 0.15s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary  { background: var(--cyan); color: #000; }
  .btn-primary:hover:not(:disabled) { opacity: 0.85; }
  .btn-ghost    { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover:not(:disabled) { background: var(--border); }
  .btn-success  { background: var(--green); color: #000; }
  .btn-success:hover:not(:disabled) { opacity: 0.85; }

  /* ── Form controls ───────────────────────────────────────────────────────── */
  .form-group { margin-bottom: 20px; }
  .form-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  input[type="text"],
  input[type="password"],
  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s;
    outline: none;
  }
  input:focus { border-color: var(--cyan); }

  .hint { font-size: 11px; color: var(--muted); margin-top: 5px; }

  /* ── Section headers ─────────────────────────────────────────────────────── */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 20px;
    margin-top: 32px;
  }
  .section-title:first-child { margin-top: 0; }

  /* ── Prerequisite rows ───────────────────────────────────────────────────── */
  .check-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .check-icon { font-size: 20px; width: 24px; text-align: center; }
  .check-name { font-weight: 500; flex: 1; }
  .check-version { font-size: 12px; color: var(--muted); }
  .check-error   { font-size: 12px; color: var(--red); }

  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Progress log ────────────────────────────────────────────────────────── */
  .log {
    background: #010409;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.7;
    height: 420px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .log-line-info   { color: #94a3b8; }
  .log-line-ok     { color: var(--green); }
  .log-line-warn   { color: var(--yellow); }
  .log-line-error  { color: var(--red); }

  /* ── Progress bar ────────────────────────────────────────────────────────── */
  .progress-wrap {
    background: var(--border);
    border-radius: 4px;
    height: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--cyan);
    border-radius: 4px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ── Password strength ───────────────────────────────────────────────────── */
  .strength-bar {
    display: flex;
    gap: 4px;
    margin-top: 6px;
  }
  .strength-seg {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    transition: background 0.2s;
  }

  /* ── Checkboxes ──────────────────────────────────────────────────────────── */
  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    background: var(--bg);
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .checkbox-row:hover { border-color: var(--cyan-dim); }
  .checkbox-row input[type="checkbox"] {
    width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; cursor: pointer;
    accent-color: var(--cyan);
  }
  .checkbox-row .cb-text strong { display: block; font-weight: 500; }
  .checkbox-row .cb-text span   { font-size: 12px; color: var(--muted); }

  /* ── Success card ────────────────────────────────────────────────────────── */
  .success-card {
    text-align: center;
    padding: 48px 0;
  }
  .success-icon { font-size: 64px; margin-bottom: 20px; }
  .success-card h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  .success-card p  { color: var(--muted); max-width: 460px; margin: 0 auto 28px; }

  .url-card {
    background: var(--bg);
    border: 1px solid var(--cyan-dim);
    border-radius: 10px;
    padding: 20px 28px;
    max-width: 440px;
    margin: 0 auto 32px;
    text-align: left;
  }
  .url-card label { color: var(--muted); text-transform: uppercase; font-size: 11px; }
  .url-card .url  { font-size: 18px; font-weight: 600; color: var(--cyan); margin-top: 4px; word-break: break-all; }

  .steps-list {
    text-align: left;
    max-width: 440px;
    margin: 0 auto;
  }
  .steps-list li {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .steps-list li:last-child { border: none; }

  /* ── Callout ─────────────────────────────────────────────────────────────── */
  .callout {
    display: flex;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .callout-info { background: rgba(34,211,238,0.07); border: 1px solid rgba(34,211,238,0.25); color: var(--cyan); }
  .callout-warn { background: rgba(245,158,11,0.07); border: 1px solid rgba(245,158,11,0.25); color: var(--yellow); }

  /* ── Welcome screen ──────────────────────────────────────────────────────── */
  .welcome-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 40px 0 48px;
  }
  .welcome-hero .brand { font-size: 36px; font-weight: 800; color: var(--cyan); letter-spacing: -1px; margin-bottom: 8px; }
  .welcome-hero .tagline { font-size: 15px; color: var(--muted); margin-bottom: 36px; }

  .feature-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: 560px;
    width: 100%;
  }
  .feature-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    text-align: left;
  }
  .feature-card .icon { font-size: 24px; margin-bottom: 8px; }
  .feature-card strong { display: block; font-size: 13px; margin-bottom: 3px; }
  .feature-card span { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">ezHealthKonnect</div>
    <div class="logo-sub">Setup Wizard</div>
  </div>
  <ul class="steps" id="stepList">
    <li class="step-item active" data-step="0"><div class="step-dot">1</div><span class="step-label">Welcome</span></li>
    <li class="step-item"       data-step="1"><div class="step-dot">2</div><span class="step-label">Prerequisites</span></li>
    <li class="step-item"       data-step="2"><div class="step-dot">3</div><span class="step-label">Configuration</span></li>
    <li class="step-item"       data-step="3"><div class="step-dot">4</div><span class="step-label">Installing</span></li>
    <li class="step-item"       data-step="4"><div class="step-dot">✓</div><span class="step-label">Complete</span></li>
  </ul>
  <div class="sidebar-footer">
    ezInterop Solutions<br>
    &copy; 2025–2026
  </div>
</aside>

<!-- ── Main ───────────────────────────────────────────────────────────────── -->
<main class="main">
  <div class="header">
    <h1 id="pageTitle">Welcome to ezHealthKonnect</h1>
    <p  id="pageDesc">Healthcare HL7↔FHIR Integration Platform — Docker Edition</p>
  </div>

  <div class="content" id="content"><!-- screens injected here --></div>

  <div class="footer" id="footer">
    <button class="btn btn-ghost" id="btnBack" style="display:none" onclick="goBack()">← Back</button>
    <button class="btn btn-primary" id="btnNext" onclick="goNext()">Get Started →</button>
  </div>
</main>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let currentStep = 0;
let checksOK    = false;
let cfg         = {};
let appURL      = '';
let installOK   = false;

const steps = [
  { title: 'Welcome to ezHealthKonnect',  desc: 'Healthcare HL7↔FHIR Integration Platform — Docker Edition' },
  { title: 'Checking Prerequisites',       desc: 'Verifying that Docker is installed and running' },
  { title: 'Configuration',               desc: 'Choose ports, install location, and passwords' },
  { title: 'Installing',                  desc: 'Building and starting ezHealthKonnect — please wait' },
  { title: 'Installation Complete',       desc: 'ezHealthKonnect is running on your machine' },
];

// ─────────────────────────────────────────────────────────────────────────────
// Navigation
// ─────────────────────────────────────────────────────────────────────────────
function setStep(n) {
  currentStep = n;
  document.querySelectorAll('.step-item').forEach((el, i) => {
    el.classList.toggle('active', i === n);
    el.classList.toggle('done',   i < n);
  });
  document.getElementById('pageTitle').textContent = steps[n].title;
  document.getElementById('pageDesc').textContent  = steps[n].desc;
  renderStep(n);
  updateNav();
}

function updateNav() {
  const back = document.getElementById('btnBack');
  const next = document.getElementById('btnNext');
  back.style.display = (currentStep > 0 && currentStep < 3) ? 'inline-flex' : 'none';
  if (currentStep === 0) { next.textContent = 'Get Started →'; next.className = 'btn btn-primary'; next.disabled = false; }
  if (currentStep === 1) { next.textContent = 'Next →';        next.className = 'btn btn-primary'; next.disabled = !checksOK; }
  if (currentStep === 2) { next.textContent = 'Install Now';   next.className = 'btn btn-primary'; next.disabled = false; }
  if (currentStep === 3) { next.style.display = 'none'; }
  if (currentStep === 4) { next.style.display = 'inline-flex'; next.textContent = 'Open in Browser'; next.className = 'btn btn-success'; next.disabled = !installOK; }
}

function goNext() {
  if (currentStep === 0) { setStep(1); runChecks();  return; }
  if (currentStep === 1) { setStep(2); loadDefaults(); return; }
  if (currentStep === 2) { if (validateConfig()) startInstall(); return; }
  if (currentStep === 4) { window.open(appURL, '_blank'); return; }
}

function goBack() {
  if (currentStep > 0 && currentStep < 3) setStep(currentStep - 1);
}

// ─────────────────────────────────────────────────────────────────────────────
// Screen: Welcome
// ─────────────────────────────────────────────────────────────────────────────
function renderStep(n) {
  const c = document.getElementById('content');
  if (n === 0) c.innerHTML = renderWelcome();
  if (n === 1) c.innerHTML = renderChecks();
  if (n === 2) c.innerHTML = renderConfig();
  if (n === 3) c.innerHTML = renderInstalling();
  if (n === 4) c.innerHTML = renderDone();
}

function renderWelcome() {
  return `
  <div class="welcome-hero">
    <div class="brand">ezHealthKonnect</div>
    <div class="tagline">AI-powered HL7 ↔ FHIR Healthcare Integration Platform</div>
    <div class="feature-grid">
      <div class="feature-card"><div class="icon">🏥</div><strong>HL7 v2 Processing</strong><span>Parse, transform, and route HL7 messages via TCP/MLLP</span></div>
      <div class="feature-card"><div class="icon">🔄</div><strong>FHIR R4 Engine</strong><span>Convert HL7 to FHIR bundles with schema validation</span></div>
      <div class="feature-card"><div class="icon">⚡</div><strong>Visual Pipeline Builder</strong><span>Drag-and-drop transformation workflow designer</span></div>
      <div class="feature-card"><div class="icon">🤖</div><strong>AI Companion</strong><span>Ollama-powered assistant for mapping suggestions</span></div>
      <div class="feature-card"><div class="icon">🔒</div><strong>HIPAA Compliance</strong><span>Audit logging, access control, and PHI protection</span></div>
      <div class="feature-card"><div class="icon">🐳</div><strong>Docker Edition</strong><span>Runs on any machine with Docker Desktop installed</span></div>
    </div>
  </div>
  <div class="callout callout-info">
    <span>ℹ️</span>
    <span>This installer will check prerequisites, collect your configuration, build the application image, and start all services. The build step takes 3–6 minutes on first run.</span>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Screen: Prerequisites
// ─────────────────────────────────────────────────────────────────────────────
function renderChecks() {
  return `
  <div id="checkRows">
    <div class="check-row"><div class="spinner"></div><div class="check-name">Checking Docker…</div></div>
  </div>
  <div class="callout callout-warn" id="dockerHint" style="display:none">
    <span>⚠️</span>
    <span>Docker is not running. <strong>Install or start Docker Desktop</strong> then click <em>Retry</em>.</span>
  </div>
  <div style="margin-top:16px" id="retryWrap" style="display:none">
    <button class="btn btn-ghost" onclick="runChecks()">↻ Retry</button>
  </div>`;
}

async function runChecks() {
  document.getElementById('checkRows').innerHTML =
    `<div class="check-row"><div class="spinner"></div><div class="check-name">Checking prerequisites…</div></div>`;
  document.getElementById('btnNext').disabled = true;

  const res   = await fetch('/api/checks');
  const items = await res.json();

  let allOK = true;
  const html = items.map(c => {
    if (!c.ok) allOK = false;
    return `<div class="check-row">
      <div class="check-icon">${c.ok ? '✅' : '❌'}</div>
      <div class="check-name">${esc(c.name)}</div>
      ${c.ok
        ? `<div class="check-version">v${esc(c.version)}</div>`
        : `<div class="check-error">${esc(c.error)}</div>`}
    </div>`;
  }).join('');

  document.getElementById('checkRows').innerHTML = html;

  const hint = document.getElementById('dockerHint');
  if (hint) hint.style.display = allOK ? 'none' : 'flex';

  checksOK = allOK;
  updateNav();

  if (!document.getElementById('retryWrap')) return;
  document.getElementById('retryWrap').style.display = allOK ? 'none' : 'block';
}

// ─────────────────────────────────────────────────────────────────────────────
// Screen: Configuration
// ─────────────────────────────────────────────────────────────────────────────
function renderConfig() {
  return `
  <div class="section-title">Install Location</div>
  <div class="form-group">
    <label>Install Directory</label>
    <input type="text" id="installDir" placeholder="e.g. C:\\ezHealthKonnect">
    <div class="hint">All application files, logs, and uploads will be stored here.</div>
  </div>

  <div class="section-title">Network Ports</div>
  <div class="callout callout-info" style="margin-bottom:16px">
    <span>ℹ️</span>
    <span>Change any port if it conflicts with other software on this machine. Press Enter to accept the default.</span>
  </div>
  <div class="form-row-3">
    <div class="form-group">
      <label>Web UI Port</label>
      <input type="text" id="appPort" placeholder="3000">
    </div>
    <div class="form-group">
      <label>Go API Port</label>
      <input type="text" id="apiPort" placeholder="8080">
    </div>
    <div class="form-group">
      <label>PostgreSQL Port</label>
      <input type="text" id="dbPort" placeholder="5432">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>MinIO API Port</label>
      <input type="text" id="minioApiPort" placeholder="9000">
    </div>
    <div class="form-group">
      <label>MinIO Console Port</label>
      <input type="text" id="minioConPort" placeholder="9001">
    </div>
  </div>

  <div class="section-title">Passwords</div>
  <div class="form-row">
    <div class="form-group">
      <label>Database Password</label>
      <input type="password" id="dbPassword" placeholder="Strong password" oninput="strengthMeter('dbPassword','dbStr')">
      <div class="strength-bar" id="dbStr"><div class="strength-seg"></div><div class="strength-seg"></div><div class="strength-seg"></div><div class="strength-seg"></div></div>
      <div class="hint">Used for the PostgreSQL database. Store this securely.</div>
    </div>
    <div class="form-group">
      <label>Storage Password</label>
      <input type="password" id="minioPassword" placeholder="Strong password" oninput="strengthMeter('minioPassword','minStr')">
      <div class="strength-bar" id="minStr"><div class="strength-seg"></div><div class="strength-seg"></div><div class="strength-seg"></div><div class="strength-seg"></div></div>
      <div class="hint">Used for MinIO object storage (message archives).</div>
    </div>
  </div>

  <div class="section-title">Options</div>
  <label class="checkbox-row" for="chkAI">
    <input type="checkbox" id="chkAI">
    <div class="cb-text">
      <strong>Enable AI Companion (Ollama)</strong>
      <span>Pulls llama3.2:3b and nomic-embed-text models (~2.3 GB download). Enables AI-powered mapping suggestions.</span>
    </div>
  </label>
  <label class="checkbox-row" for="chkSvc">
    <input type="checkbox" id="chkSvc" checked>
    <div class="cb-text">
      <strong>Register as a system service</strong>
      <span>Auto-starts ezHealthKonnect when the machine boots (requires administrator / root privileges).</span>
    </div>
  </label>`;
}

async function loadDefaults() {
  const res = await fetch('/api/defaults');
  const d   = await res.json();
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
  set('installDir',   d.installDir);
  set('appPort',      d.appPort);
  set('apiPort',      d.apiPort);
  set('dbPort',       d.dbPort);
  set('minioApiPort', d.minioApiPort);
  set('minioConPort', d.minioConPort);
}

function validateConfig() {
  const required = ['installDir','appPort','apiPort','dbPort','minioApiPort','minioConPort','dbPassword','minioPassword'];
  for (const id of required) {
    const el = document.getElementById(id);
    if (!el || !el.value.trim()) {
      el && el.focus();
      el && (el.style.borderColor = 'var(--red)');
      return false;
    }
    el.style.borderColor = '';
  }
  cfg = {
    installDir:    document.getElementById('installDir').value.trim(),
    appPort:       document.getElementById('appPort').value.trim(),
    apiPort:       document.getElementById('apiPort').value.trim(),
    dbPort:        document.getElementById('dbPort').value.trim(),
    minioApiPort:  document.getElementById('minioApiPort').value.trim(),
    minioConPort:  document.getElementById('minioConPort').value.trim(),
    dbPassword:    document.getElementById('dbPassword').value,
    minioPassword: document.getElementById('minioPassword').value,
    withAI:        document.getElementById('chkAI').checked,
    registerService: document.getElementById('chkSvc').checked,
  };
  return true;
}

function strengthMeter(inputId, barId) {
  const val  = document.getElementById(inputId).value;
  const segs = document.querySelectorAll(`#${barId} .strength-seg`);
  let score = 0;
  if (val.length >= 8)  score++;
  if (val.length >= 12) score++;
  if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
  if (/[0-9!@#$%^&*]/.test(val)) score++;
  const colors = ['var(--red)', 'var(--yellow)', 'var(--yellow)', 'var(--green)'];
  segs.forEach((s, i) => s.style.background = i < score ? colors[score - 1] : 'var(--border)');
}

// ─────────────────────────────────────────────────────────────────────────────
// Screen: Installing
// ─────────────────────────────────────────────────────────────────────────────
function renderInstalling() {
  return `
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="log" id="log"></div>`;
}

let logLines = 0;
const MAX_LOG_LINES = 500;

async function startInstall() {
  setStep(3);

  // POST config to server
  await fetch('/api/install', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(cfg),
  });

  // Subscribe to SSE progress stream
  const es = new EventSource('/api/progress');
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.level === 'done') {
      es.close();
      appURL    = msg.msg || `http://localhost:${cfg.appPort}`;
      installOK = true;
      advanceProgress(100);
      setTimeout(() => setStep(4), 800);
      return;
    }
    appendLog(msg.level, msg.msg);
    advanceProgress();
  };
  es.onerror = () => {
    appendLog('warn', 'Connection to installer lost — the installation may still be running.');
    es.close();
  };
}

function appendLog(level, msg) {
  const log = document.getElementById('log');
  if (!log) return;
  logLines++;
  if (logLines > MAX_LOG_LINES) {
    // Remove oldest line
    const first = log.querySelector('div');
    if (first) first.remove();
  }
  const div = document.createElement('div');
  div.className = `log-line-${level}`;
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

let progressVal = 0;
function advanceProgress(target) {
  if (target !== undefined) {
    progressVal = target;
  } else {
    // Animate progress: slow ramp that never quite reaches 95% until done.
    const gap = 95 - progressVal;
    progressVal += Math.max(0.3, gap * 0.04);
    progressVal  = Math.min(94, progressVal);
  }
  const bar = document.getElementById('progressBar');
  if (bar) bar.style.width = progressVal + '%';
}

// ─────────────────────────────────────────────────────────────────────────────
// Screen: Done
// ─────────────────────────────────────────────────────────────────────────────
function renderDone() {
  return `
  <div class="success-card">
    <div class="success-icon">🎉</div>
    <h2>Installation Complete!</h2>
    <p>ezHealthKonnect is running. Open the platform in your browser and follow the setup wizard to create your administrator account.</p>

    <div class="url-card">
      <label>Platform URL</label>
      <div class="url">${esc(appURL || `http://localhost:${cfg.appPort}`)}</div>
    </div>

    <ul class="steps-list">
      <li>✅ Docker image built and all services started</li>
      <li>✅ PostgreSQL database initialised and migrated</li>
      <li>✅ MinIO object storage ready</li>
      ${cfg.registerService ? '<li>✅ System service registered (auto-start on boot)</li>' : ''}
      ${cfg.withAI ? '<li>⏳ AI models downloading in background (~2.3 GB)</li>' : ''}
    </ul>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Utility
// ─────────────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
renderStep(0);
updateNav();
</script>
</body>
</html>
