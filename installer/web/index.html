<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ezHealthKonnect Setup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Brand: Navy + Pink */
    --navy:      #1e3a8a;
    --navy-mid:  #1e40af;
    --navy-light:#3b82f6;
    --pink:      #f8bbd9;
    --pink-acc:  #ec4899;

    /* Surfaces */
    --bg:        #0f172a;
    --surface:   #1e293b;
    --surface2:  #162044;
    --border:    #334155;

    /* Status */
    --green:  #22c55e;
    --red:    #ef4444;
    --yellow: #f59e0b;
    --text:   #e2e8f0;
    --muted:  #94a3b8;

    --sidebar-w: 250px;
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Sidebar ──────────────────────────────────────────────────────────────── */
  .sidebar {
    width: var(--sidebar-w);
    background: linear-gradient(180deg, var(--navy) 0%, var(--surface2) 100%);
    border-right: 1px solid rgba(248,187,217,0.15);
    display: flex;
    flex-direction: column;
    padding: 0;
    flex-shrink: 0;
  }

  .logo-area {
    padding: 28px 24px 24px;
    border-bottom: 1px solid rgba(248,187,217,0.15);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .logo-svg { width: 40px; height: 40px; }
  .logo-name {
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .logo-name span { color: var(--pink); }
  .logo-sub {
    font-size: 10px;
    color: rgba(248,187,217,0.6);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  .steps {
    list-style: none;
    padding: 28px 0;
    flex: 1;
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    cursor: default;
    transition: background 0.15s;
  }
  .step-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .step-label {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    transition: color 0.2s;
  }
  .step-item.active .step-dot {
    border-color: var(--pink);
    background: var(--pink);
    color: var(--navy);
  }
  .step-item.active .step-label { color: #fff; font-weight: 600; }
  .step-item.done .step-dot {
    border-color: var(--green);
    background: var(--green);
    color: #fff;
  }
  .step-item.done .step-label { color: rgba(255,255,255,0.5); }

  .sidebar-footer {
    padding: 20px 24px;
    border-top: 1px solid rgba(248,187,217,0.1);
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    line-height: 1.6;
  }

  /* ── Main ─────────────────────────────────────────────────────────────────── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .header {
    padding: 22px 40px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-text h1 { font-size: 19px; font-weight: 700; }
  .header-text p  { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .content { flex: 1; overflow-y: auto; padding: 36px 40px; }

  .footer {
    padding: 18px 40px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }

  /* ── Buttons ──────────────────────────────────────────────────────────────── */
  .btn {
    padding: 9px 22px; border-radius: 7px; font-size: 14px; font-weight: 600;
    cursor: pointer; border: 1px solid transparent;
    transition: opacity 0.15s, background 0.15s, transform 0.1s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:disabled { opacity: 0.38; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(0.97); }

  .btn-primary  { background: linear-gradient(135deg, var(--navy-mid), var(--navy-light)); color: #fff; }
  .btn-primary:hover:not(:disabled) { opacity: 0.9; }
  .btn-pink     { background: var(--pink-acc); color: #fff; }
  .btn-pink:hover:not(:disabled) { opacity: 0.88; }
  .btn-ghost    { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover:not(:disabled) { background: var(--border); }
  .btn-success  { background: var(--green); color: #fff; }
  .btn-success:hover:not(:disabled) { opacity: 0.88; }
  .btn-danger   { background: transparent; color: var(--red); border-color: var(--red); }
  .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.1); }
  .btn-icon {
    padding: 9px 12px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); cursor: pointer; font-size: 16px;
    display: inline-flex; align-items: center;
    transition: background 0.15s;
  }
  .btn-icon:hover { background: var(--border); }

  /* ── Forms ────────────────────────────────────────────────────────────────── */
  .form-group { margin-bottom: 18px; }
  .form-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  label {
    display: block; font-size: 11px; font-weight: 600; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em;
  }

  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s;
    outline: none;
  }
  input:focus { border-color: var(--navy-light); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 5px; }

  /* Dir picker row */
  .dir-row { display: flex; gap: 8px; }
  .dir-row input { flex: 1; }

  /* ── Section headers ──────────────────────────────────────────────────────── */
  .section-title {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 18px; margin-top: 28px;
  }
  .section-title:first-child { margin-top: 0; }

  /* ── Check rows ───────────────────────────────────────────────────────────── */
  .check-row {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 16px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .check-icon { font-size: 20px; width: 24px; text-align: center; }
  .check-name { font-weight: 500; flex: 1; }
  .check-version { font-size: 12px; color: var(--muted); }
  .check-error   { font-size: 12px; color: var(--red); }

  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--navy-light);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Progress log ─────────────────────────────────────────────────────────── */
  .log {
    background: #060e1f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-family: "Cascadia Code","Fira Code",Consolas,monospace;
    font-size: 12.5px;
    line-height: 1.7;
    height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log-line-info  { color: #94a3b8; }
  .log-line-ok    { color: var(--green); }
  .log-line-warn  { color: var(--yellow); }
  .log-line-error { color: var(--red); }

  /* ── Progress bar ─────────────────────────────────────────────────────────── */
  .progress-wrap {
    background: var(--border); border-radius: 4px; height: 6px;
    margin-bottom: 18px; overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--navy-mid), var(--pink-acc));
    border-radius: 4px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 12px; color: var(--muted); margin-bottom: 6px;
    display: flex; justify-content: space-between;
  }

  /* ── Password strength ────────────────────────────────────────────────────── */
  .strength-bar { display: flex; gap: 4px; margin-top: 6px; }
  .strength-seg { flex: 1; height: 3px; border-radius: 2px; background: var(--border); transition: background 0.2s; }

  /* ── Checkboxes ───────────────────────────────────────────────────────────── */
  .checkbox-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 13px 16px; border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer;
    background: var(--bg); margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .checkbox-row:hover { border-color: var(--navy-light); }
  .checkbox-row input[type="checkbox"] {
    width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0;
    cursor: pointer; accent-color: var(--pink-acc);
  }
  .checkbox-row .cb-text strong { display: block; font-weight: 600; }
  .checkbox-row .cb-text span   { font-size: 12px; color: var(--muted); }

  /* ── Callouts ─────────────────────────────────────────────────────────────── */
  .callout {
    display: flex; gap: 12px; padding: 13px 16px;
    border-radius: 8px; font-size: 13px; margin-bottom: 20px;
  }
  .callout-info { background: rgba(30,64,175,0.12); border: 1px solid rgba(59,130,246,0.3); color: #93c5fd; }
  .callout-warn { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.3); color: var(--yellow); }
  .callout-pink { background: rgba(236,72,153,0.08); border: 1px solid rgba(236,72,153,0.25); color: var(--pink); }

  /* ── Welcome / edition picker ─────────────────────────────────────────────── */
  .welcome-hero {
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 32px 0 24px;
  }
  .welcome-logo-big {
    width: 64px; height: 64px; margin-bottom: 16px;
  }
  .welcome-hero .brand {
    font-size: 30px; font-weight: 800;
    background: linear-gradient(90deg, #fff 40%, var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -1px; margin-bottom: 6px;
  }
  .welcome-hero .tagline { font-size: 14px; color: var(--muted); margin-bottom: 32px; }

  .edition-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 560px; width: 100%; margin-top: 8px; }
  .edition-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px; padding: 22px 20px;
    cursor: pointer; text-align: left;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .edition-card:hover { border-color: var(--navy-light); }
  .edition-card.selected { border-color: var(--pink-acc); background: rgba(236,72,153,0.06); }
  .edition-card .ed-icon  { font-size: 28px; margin-bottom: 10px; }
  .edition-card .ed-title { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
  .edition-card .ed-desc  { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .edition-card .ed-badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
    background: rgba(236,72,153,0.18); color: var(--pink-acc);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .edition-card .ed-reqs {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
  }
  .edition-card .ed-reqs span { display: block; padding: 2px 0; }

  /* ── Feature grid ─────────────────────────────────────────────────────────── */
  .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 560px; width: 100%; margin-top: 24px; }
  .feature-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; text-align: left;
  }
  .feature-card .icon { font-size: 22px; margin-bottom: 8px; }
  .feature-card strong { display: block; font-size: 13px; margin-bottom: 3px; }
  .feature-card span { font-size: 12px; color: var(--muted); }

  /* ── Success screen ───────────────────────────────────────────────────────── */
  .success-card { text-align: center; padding: 40px 0; }
  .success-icon { font-size: 60px; margin-bottom: 16px; }
  .success-card h2 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .success-card p  { color: var(--muted); max-width: 460px; margin: 0 auto 24px; }

  .url-card {
    background: var(--bg);
    border: 1px solid rgba(59,130,246,0.35);
    border-radius: 10px; padding: 18px 24px;
    max-width: 420px; margin: 0 auto 28px; text-align: left;
  }
  .url-card label { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.06em; }
  .url-card .url  { font-size: 17px; font-weight: 700; color: var(--navy-light); margin-top: 4px; word-break: break-all; }

  .steps-list { text-align: left; max-width: 440px; margin: 0 auto; }
  .steps-list li {
    padding: 8px 0; border-bottom: 1px solid var(--border);
    color: var(--muted); font-size: 13px;
  }
  .steps-list li:last-child { border: none; }

  .done-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }

  /* ── File browser modal ───────────────────────────────────────────────────── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 520px; max-width: 95vw;
    max-height: 80vh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header h3 { font-size: 15px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
  .modal-close:hover { color: var(--text); }
  .modal-path {
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 12px; font-family: monospace;
    color: var(--navy-light);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modal-body { flex: 1; overflow-y: auto; padding: 8px 0; min-height: 200px; }
  .dir-entry {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 18px; cursor: pointer;
    transition: background 0.1s;
    font-size: 13px;
  }
  .dir-entry:hover { background: var(--bg); }
  .dir-entry.up { color: var(--muted); font-style: italic; }
  .dir-entry-icon { font-size: 16px; width: 20px; }
  .modal-footer {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    display: flex; gap: 10px; justify-content: flex-end;
    align-items: center;
  }
  .modal-footer .selected-path {
    flex: 1; font-size: 12px; color: var(--muted);
    font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
</style>
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="logo-area">
    <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="10" fill="#1e40af"/>
      <path d="M8 20 Q14 10 20 20 Q26 30 32 20" stroke="#f8bbd9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M8 20 Q14 10 20 20 Q26 30 32 20" stroke="#ec4899" stroke-width="1" fill="none" stroke-linecap="round" stroke-dasharray="2 4" stroke-dashoffset="3"/>
      <circle cx="20" cy="20" r="3" fill="#fff"/>
      <circle cx="8"  cy="20" r="2" fill="#f8bbd9"/>
      <circle cx="32" cy="20" r="2" fill="#f8bbd9"/>
    </svg>
    <div class="logo-name">ez<span>Health</span>Konnect</div>
    <div class="logo-sub">Setup Wizard</div>
  </div>

  <ul class="steps" id="stepList">
    <li class="step-item active" data-step="0"><div class="step-dot">1</div><span class="step-label">Welcome</span></li>
    <li class="step-item"        data-step="1"><div class="step-dot">2</div><span class="step-label">Prerequisites</span></li>
    <li class="step-item"        data-step="2"><div class="step-dot">3</div><span class="step-label">Configuration</span></li>
    <li class="step-item"        data-step="3"><div class="step-dot">4</div><span class="step-label">Installing</span></li>
    <li class="step-item"        data-step="4"><div class="step-dot">✓</div><span class="step-label">Complete</span></li>
  </ul>

  <div class="sidebar-footer">
    <a href="https://www.ezInterOpSolutions.com" target="_blank"
       style="color:rgba(255,255,255,0.35);text-decoration:none;"
       onmouseover="this.style.color='rgba(248,187,217,0.7)'"
       onmouseout="this.style.color='rgba(255,255,255,0.35)'">ezInterOp Solutions</a><br>
    &copy; 2025–2026
  </div>
</aside>

<!-- ── Main ────────────────────────────────────────────────────────────────── -->
<main class="main">
  <div class="header">
    <div class="header-text">
      <h1 id="pageTitle">Welcome to ezHealthKonnect</h1>
      <p  id="pageDesc">Healthcare HL7 ↔ FHIR Integration Platform</p>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="footer" id="footer">
    <button class="btn btn-ghost"    id="btnBack" style="display:none" onclick="goBack()">← Back</button>
    <button class="btn btn-primary"  id="btnNext" onclick="goNext()">Get Started →</button>
  </div>
</main>

<!-- ── File browser modal ────────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="browseModal" style="display:none" onclick="closeBrowse(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>📁 Choose Install Directory</h3>
      <button class="modal-close" onclick="closeBrowseModal()">✕</button>
    </div>
    <div class="modal-path" id="browsePath">/</div>
    <div class="modal-body" id="browseBody"><div style="padding:24px;text-align:center;color:var(--muted)">Loading…</div></div>
    <div class="modal-footer">
      <span class="selected-path" id="browseSelected">—</span>
      <button class="btn btn-ghost" onclick="closeBrowseModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmBrowse()">Select This Folder</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let currentStep = 0;
let checksOK    = false;
let cfg         = {};
let appURL      = '';
let installOK   = false;
let installMode = 'docker'; // 'docker' | 'standalone'

// File browser state
let browseCurrentPath = '';
let browseTargetInput = '';

function stepDescs() {
  if (installMode === 'standalone') {
    return [
      { title: 'Welcome to ezHealthKonnect',  desc: 'Healthcare HL7 ↔ FHIR Integration Platform' },
      { title: 'Checking Prerequisites',       desc: 'Verifying OS, disk space, and port availability' },
      { title: 'Configuration',               desc: 'Choose ports, install location, and passwords' },
      { title: 'Installing',                  desc: 'Installing dependencies and starting services' },
      { title: 'Installation Complete',       desc: 'ezHealthKonnect is running on your machine' },
    ];
  }
  return [
    { title: 'Welcome to ezHealthKonnect',  desc: 'Healthcare HL7 ↔ FHIR Integration Platform — Docker Edition' },
    { title: 'Checking Prerequisites',       desc: 'Verifying that Docker is installed and running' },
    { title: 'Configuration',               desc: 'Choose ports, install location, and passwords' },
    { title: 'Installing',                  desc: 'Building and starting ezHealthKonnect' },
    { title: 'Installation Complete',       desc: 'ezHealthKonnect is running on your machine' },
  ];
}

// ─────────────────────────────────────────────────────────────────────────────
// Navigation
// ─────────────────────────────────────────────────────────────────────────────
function setStep(n) {
  currentStep = n;
  const steps = stepDescs();
  document.querySelectorAll('.step-item').forEach((el, i) => {
    el.classList.toggle('active', i === n);
    el.classList.toggle('done',   i < n);
  });
  document.getElementById('pageTitle').textContent = steps[n].title;
  document.getElementById('pageDesc').textContent  = steps[n].desc;
  renderStep(n);
  updateNav();
}

function updateNav() {
  const back = document.getElementById('btnBack');
  const next = document.getElementById('btnNext');
  back.style.display = (currentStep > 0 && currentStep < 3) ? 'inline-flex' : 'none';
  if (currentStep === 0) { next.textContent = 'Get Started →'; next.className = 'btn btn-primary'; next.disabled = false; next.style.display = 'inline-flex'; }
  if (currentStep === 1) { next.textContent = 'Next →';        next.className = 'btn btn-primary'; next.disabled = !checksOK; next.style.display = 'inline-flex'; }
  if (currentStep === 2) { next.textContent = 'Install Now';   next.className = 'btn btn-pink';    next.disabled = false;    next.style.display = 'inline-flex'; }
  if (currentStep === 3) { next.style.display = 'none'; }
  if (currentStep === 4) { next.style.display = 'none'; } // Done screen has its own buttons
}

function goNext() {
  if (currentStep === 0) { setStep(1); runChecks(); return; }
  if (currentStep === 1) { setStep(2); loadDefaults(); return; }
  if (currentStep === 2) { if (validateConfig()) startInstall(); return; }
}

function goBack() {
  if (currentStep > 0 && currentStep < 3) setStep(currentStep - 1);
}

async function runChecks() {
  document.getElementById('checkRows').innerHTML =
    `<div class="check-row"><div class="spinner"></div><div class="check-name">Checking prerequisites…</div></div>`;
  document.getElementById('btnNext').disabled = true;

  const endpoint = installMode === 'standalone' ? '/api/checks-standalone' : '/api/checks';
  const res   = await fetch(endpoint);
  const items = await res.json();

  let allOK = true;
  const html = items.map(c => {
    if (!c.ok) allOK = false;
    return `<div class="check-row">
      <div class="check-icon">${c.ok ? '✅' : '❌'}</div>
      <div class="check-name">${esc(c.name)}</div>
      ${c.ok
        ? `<div class="check-version">${esc(c.version || '')}</div>`
        : `<div class="check-error">${esc(c.error)}</div>`}
    </div>`;
  }).join('');

  document.getElementById('checkRows').innerHTML = html;
  const hint = document.getElementById('checksHint');
  if (hint) {
    hint.style.display = allOK ? 'none' : 'flex';
    if (!allOK) document.getElementById('checksHintText').textContent = installMode === 'standalone'
      ? 'Some requirements are not met. Review the items above, fix them, then retry.'
      : 'Docker is not running. Install or start Docker Desktop then click Retry.';
  }
  checksOK = allOK;
  updateNav();
}

async function installDockerFlow() {
  const btn = document.querySelector('[onclick="installDockerFlow()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Installing Docker…'; }
  await fetch('/api/install-docker', { method: 'POST' });
  const es = new EventSource('/api/docker-progress');
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.level === 'done') { es.close(); runChecks(); return; }
  };
}

async function loadDefaults() {
  const res = await fetch('/api/defaults');
  const d   = await res.json();
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
  set('installDir',   d.installDir);
  set('appPort',      d.appPort);
  set('apiPort',      d.apiPort);
  set('dbPort',       d.dbPort);
  set('minioApiPort', d.minioApiPort);
  set('minioConPort', d.minioConPort);
  const dbNameEl = document.getElementById('dbName');
  if (dbNameEl) dbNameEl.value = 'ezhealthkonnect';
  const dbUserEl = document.getElementById('dbUser');
  if (dbUserEl) dbUserEl.value = 'ezhealth_user';
}

function validateConfig() {
  const isStandalone = installMode === 'standalone';
  const required = isStandalone
    ? ['installDir','appPort','apiPort','dbPort','dbPassword']
    : ['installDir','appPort','apiPort','dbPort','minioApiPort','minioConPort','dbPassword','minioPassword'];

  for (const id of required) {
    const el = document.getElementById(id);
    if (!el || !el.value.trim()) {
      if (el) { el.focus(); el.style.borderColor = 'var(--red)'; }
      return false;
    }
    el.style.borderColor = '';
  }

  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  cfg = {
    mode:            installMode,
    installDir:      g('installDir'),
    appPort:         g('appPort'),
    apiPort:         g('apiPort'),
    dbPort:          g('dbPort'),
    dbPassword:      document.getElementById('dbPassword').value,
    withAI:          document.getElementById('chkAI').checked,
    registerService: document.getElementById('chkSvc').checked,
    version:         'latest',
    minioApiPort:    g('minioApiPort'),
    minioConPort:    g('minioConPort'),
    minioPassword:   g('minioPassword') || '',
    dbUser:          g('dbUser') || 'ezhealth_user',
    dbName:          g('dbName') || 'ezhealthkonnect',
  };
  return true;
}

function strengthMeter(inputId, barId) {
  const val  = document.getElementById(inputId).value;
  const segs = document.querySelectorAll(`#${barId} .strength-seg`);
  let score = 0;
  if (val.length >= 8)  score++;
  if (val.length >= 12) score++;
  if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
  if (/[0-9!@#$%^&*]/.test(val)) score++;
  const colors = ['var(--red)','var(--yellow)','var(--yellow)','var(--green)'];
  segs.forEach((s, i) => s.style.background = i < score ? colors[score-1] : 'var(--border)');
}

// Screen: Installing
// ─────────────────────────────────────────────────────────────────────────────
function renderInstalling() {
  return `
  <div class="progress-label">
    <span id="progressStep">Starting installation…</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="log" id="log"></div>`;
}

let logLines = 0;
const MAX_LOG_LINES = 500;

async function startInstall() {
  setStep(3);

  // Subscribe to SSE FIRST so we don't miss early messages
  const es = new EventSource('/api/progress');
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.level === 'done') {
      es.close();
      appURL    = msg.msg || `http://localhost:${cfg.appPort}`;
      installOK = true;
      advanceProgress(100, 'Complete!');
      setTimeout(() => setStep(4), 900);
      return;
    }
    if (msg.level === 'failed') {
      es.close();
      advanceProgress(100, 'Failed');
      document.getElementById('progressBar').style.background = 'var(--red)';
      document.getElementById('progressPct').style.color = 'var(--red)';
      document.getElementById('progressStep').textContent = '❌ Installation failed — see log above';
      appendLog('error', '');
      appendLog('error', '─────────────────────────────────────');
      appendLog('error', '  Installation failed. Review the log above for details.');
      appendLog('error', '  Fix the issue and run the installer again.');
      appendLog('error', '─────────────────────────────────────');
      // Show a retry button
      const retryDiv = document.createElement('div');
      retryDiv.style = 'margin-top:16px';
      retryDiv.innerHTML = `<button class="btn btn-ghost" onclick="setStep(2)">← Back to Configuration</button>`;
      document.getElementById('content').appendChild(retryDiv);
      return;
    }
    appendLog(msg.level, msg.msg);
    advanceProgress(null, msg.msg);
  };
  es.onerror = () => {
    appendLog('warn', 'Connection to installer lost — the installation may still be running.');
    es.close();
  };

  // THEN post config to kick off the goroutine
  await fetch('/api/install', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(cfg),
  });
}

function appendLog(level, msg) {
  const log = document.getElementById('log');
  if (!log) return;
  logLines++;
  if (logLines > MAX_LOG_LINES) {
    const first = log.querySelector('div');
    if (first) first.remove();
  }
  const div = document.createElement('div');
  div.className = `log-line-${level}`;
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

let progressVal = 0;
function advanceProgress(target, label) {
  if (target !== undefined && target !== null) {
    progressVal = target;
  } else {
    const gap = 95 - progressVal;
    progressVal += Math.max(0.4, gap * 0.05);
    progressVal  = Math.min(94, progressVal);
  }
  const bar  = document.getElementById('progressBar');
  const pct  = document.getElementById('progressPct');
  const step = document.getElementById('progressStep');
  if (bar)  bar.style.width  = Math.round(progressVal) + '%';
  if (pct)  pct.textContent  = Math.round(progressVal) + '%';
  if (step && label) step.textContent = label;
}

    <p>ezHealthKonnect is running. Open the platform and log in with the default credentials below.</p>

    <div class="url-card">
      <label>Platform URL</label>
      <div class="url">${url}</div>
    </div>

    <ul class="steps-list">
      ${items.filter(Boolean).map(t => `<li>${t}</li>`).join('')}
    </ul>

    <p style="margin-top:18px;font-size:12px;color:var(--yellow)">
      ⚠️ Default login: admin@ezhealthkonnect.com / admin123 — change this immediately after first login.
    </p>

    <div class="done-actions">
      <button class="btn btn-success" onclick="window.open('${url}','_blank')">🚀 Open in Browser</button>
      <button class="btn btn-ghost"   onclick="copyToClipboard('${url}')">📋 Copy URL</button>
      <button class="btn btn-danger"  onclick="confirmUninstall()">🗑 Uninstall</button>
    </div>
  </div>`;
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => alert('URL copied to clipboard.'));
}

// ─────────────────────────────────────────────────────────────────────────────
// Uninstall
// ─────────────────────────────────────────────────────────────────────────────
async function confirmUninstall() {
  const ok = confirm(
    'Uninstall ezHealthKonnect?\n\n' +
    '• All services will be stopped and removed\n' +
    '• Application files in ' + (cfg.installDir || 'the install directory') + ' will be deleted\n' +
    '• The database will be dropped\n\n' +
    'This cannot be undone. Continue?'
  );
  if (!ok) return;

  // Show a minimal progress view
  document.getElementById('content').innerHTML = `
    <div style="text-align:center;padding:60px 0">
      <div class="spinner" style="margin:0 auto 20px;width:36px;height:36px;border-width:3px"></div>
      <p style="color:var(--muted)">Uninstalling — please wait…</p>
      <div class="log" id="log" style="margin-top:24px;height:260px;text-align:left"></div>
    </div>`;
  document.getElementById('footer').style.display = 'none';

  // Subscribe SSE then trigger uninstall
  const es = new EventSource('/api/progress');
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.level === 'done') {
      es.close();
      document.getElementById('content').innerHTML = `
        <div class="success-card">
          <div class="success-icon">🗑</div>
          <h2>Uninstalled</h2>
          <p style="color:var(--muted)">ezHealthKonnect has been removed from this machine.<br>You may close this window.</p>
        </div>`;
      return;
    }
    appendLog(msg.level, msg.msg);
  };
  es.onerror = () => es.close();

  await fetch('/api/uninstall', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(cfg),
  });
}

// File browser
// ─────────────────────────────────────────────────────────────────────────────
function openBrowse(inputId) {
  browseTargetInput = inputId;
  const current = document.getElementById(inputId).value.trim();
  const start   = current || '/';
  browseCurrentPath = start;
  document.getElementById('browseModal').style.display = 'flex';
  loadBrowse(start);
}

function closeBrowseModal() {
  document.getElementById('browseModal').style.display = 'none';
}

function closeBrowse(e) {
  if (e.target === document.getElementById('browseModal')) closeBrowseModal();
}

async function loadBrowse(path) {
  document.getElementById('browsePath').textContent = path;
  document.getElementById('browseSelected').textContent = path;
  browseCurrentPath = path;
  document.getElementById('browseBody').innerHTML =
    `<div style="padding:24px;text-align:center;color:var(--muted)"><div class="spinner" style="margin:0 auto"></div></div>`;

  const res  = await fetch('/api/browse?path=' + encodeURIComponent(path));
  const data = await res.json();

  let html = '';
  if (data.parent) {
    html += `<div class="dir-entry up" onclick="loadBrowse('${esc(data.parent)}')">
      <span class="dir-entry-icon">⬆</span> .. (up)
    </div>`;
  }
  if (data.dirs && data.dirs.length) {
    html += data.dirs.map(d => `
      <div class="dir-entry" onclick="loadBrowse('${esc(d.path)}')">
        <span class="dir-entry-icon">📁</span>${esc(d.name)}
      </div>`).join('');
  } else if (!data.parent) {
    html += `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">No subdirectories</div>`;
  }
  document.getElementById('browseBody').innerHTML = html || `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Empty</div>`;
}

function confirmBrowse() {
  const el = document.getElementById(browseTargetInput);
  if (el) el.value = browseCurrentPath;
  closeBrowseModal();
}

// ─────────────────────────────────────────────────────────────────────────────
// Utility
// ─────────────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
renderStep(0);
updateNav();
</script>
