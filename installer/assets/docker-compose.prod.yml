# docker-compose.prod.yml
# Production stack — no source volume mounts, all secrets from .env
# Generated by the ezHealthKonnect installer.  Edit .env to reconfigure.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# All ${...} variables are read from the .env file in the same directory.

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ezhk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ezhealthkonnect
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ezhealthkonnect"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ezhk

  # ── Flyway migrations ───────────────────────────────────────────────────────
  flyway:
    image: flyway/flyway:10-alpine
    container_name: ezhk-flyway
    environment:
      FLYWAY_URL:                  jdbc:postgresql://postgres:5432/ezhealthkonnect
      FLYWAY_USER:                 ${DB_USER}
      FLYWAY_PASSWORD:             ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE:  "true"
      FLYWAY_CONNECT_RETRIES:      10
    volumes:
      - ./database/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["repair", "migrate"]
    networks:
      - ezhk

  # ── MinIO object storage ────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ezhk-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ezhk

  # ── Ollama local LLM (optional — skip if AI_ENABLED=false) ─────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ezhk-ollama
    restart: unless-stopped
    profiles:
      - ai
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ezhk

  # ── Application ─────────────────────────────────────────────────────────────
  app:
    image: ${APP_IMAGE:-shanawaz107/ezhealthkonnect:latest}
    container_name: ezhk-app
    restart: unless-stopped
    environment:
      NODE_ENV: production

      # Database
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ezhealthkonnect
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL:      ${DB_SSL:-false}

      # App
      PORT:     3000
      API_PORT: 8080

      # Secrets — generated by installer
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET:     ${JWT_SECRET}
      # Connector-credential encryption key (generated once by the installer,
      # preserved on re-install). Empty = plaintext passthrough (warning logged).
      APP_CREDENTIAL_KEY: ${APP_CREDENTIAL_KEY:-}

      # Object storage (MinIO)
      OBJECT_STORAGE_DRIVER:     s3
      OBJECT_STORAGE_BUCKET:     ezhealthkonnect
      OBJECT_STORAGE_REGION:     us-east-1
      OBJECT_STORAGE_ENDPOINT:   http://minio:9000
      OBJECT_STORAGE_PATH_STYLE: "true"
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_PASSWORD}

      # AI / Ollama (only used when the ai profile is active)
      OLLAMA_HOST:        http://ollama:11434
      OLLAMA_CHAT_MODEL:  ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}

      # Schema package directory
      EZHEALTHKONNECT_SCHEMA_DIR: /app/schemas

      # Compliance
      HIPAA_COMPLIANCE_MODE: "true"
      GDPR_COMPLIANCE_MODE:  "true"

    ports:
      - "0.0.0.0:${APP_PORT:-3000}:3000"
      - "0.0.0.0:${API_PORT:-8080}:8080"
      # HL7 TCP/MLLP ports — 0.0.0.0: forces IPv4 (WSL2 defaults to IPv6-only).
      # Windows Docker Desktop cannot handle large NAT ranges — keep these small.
      - "0.0.0.0:2575:2575"         # Standard HL7 MLLP
      - "0.0.0.0:6500-6700:6500-6700" # Custom HL7 range (201 ports, includes 6601)
      # HTTP/FHIR receiver ports
      - "0.0.0.0:8081-8099:8081-8099"

    volumes:
      # Persistent data directories (not source code)
      - schemas_data:/app/schemas
      - logs_data:/app/logs
      - uploads_data:/app/uploads
      # Docker self-management: allows the app to rewrite the compose file
      # and restart itself with updated port ranges from the Settings UI.
      - ./docker-compose.prod.yml:/app/docker-compose.prod.yml
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - ezhk

# ── Named volumes ───────────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  ollama_data:
  schemas_data:
  logs_data:
  uploads_data:

# ── Network ─────────────────────────────────────────────────────────────────
networks:
  ezhk:
    driver: bridge
