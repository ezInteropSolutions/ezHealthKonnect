services:
  # PostgreSQL Database Service
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ezhealthkonnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ezhealthkonnect
      POSTGRES_USER: ezhealth_user
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      # PERSISTENT DATA - This survives docker-compose down
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezhealth_user -d ezhealthkonnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezhealthkonnect

  # MinIO — S3-compatible object storage for raw messages, parsed content, and logs
  minio:
    image: minio/minio:latest
    container_name: ezhealthkonnect-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ezhealth_user
      MINIO_ROOT_PASSWORD: secure_password_change_me
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console (browser UI)
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezhealthkonnect

  # Ollama — local LLM inference server (no PHI leaves the network)
  ollama:
    image: ollama/ollama:latest
    container_name: ezhealthkonnect-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ${USERPROFILE}/.ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    # GPU support: uncomment the block below and ensure nvidia-container-toolkit is installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ezhealthkonnect

  # ollama-init pulls required models once on first startup
  ollama-init:
    image: ollama/ollama:latest
    container_name: ezhealthkonnect-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ${USERPROFILE}/.ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "
        echo 'Pulling LLM models...' &&
        ollama pull llama3.2:3b &&
        ollama pull nomic-embed-text &&
        echo 'Models ready.'
      "
    networks:
      - ezhealthkonnect
    restart: "no"

  # Flyway handles SCHEMA migrations only (version controlled)
  flyway:
    image: flyway/flyway:latest
    container_name: ezhealthkonnect-flyway
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/ezhealthkonnect
      FLYWAY_USER: ezhealth_user
      FLYWAY_PASSWORD: secure_password_change_me
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_PLACEHOLDER_REPLACEMENT: "false"
    volumes:
      # Only schema migrations (no data inserts)
      - ./database/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ezhealthkonnect
    command: ["repair", "migrate"]

  # Your Application Service - FIXED VERSION
  app:
    build: .
    image: ezhealthkonnect-app
    container_name: ezhealthkonnect-app
    environment:
      # Database connection - CHANGED to use Docker PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ezhealthkonnect
      DB_USER: ezhealth_user
      DB_PASSWORD: secure_password_change_me
      DB_SSL: false
      
      # Application settings
      API_PORT: 8080
      PORT: 3000
      NODE_ENV: development
      
      # Session secrets
      SESSION_SECRET: ezhealthkonnect_session_secret_key_for_development_1234567890123
      JWT_SECRET: ezhealthkonnect_jwt_secret_key_for_development_12345678901234567890
      
      # Feature flags
      ENABLE_POSTGRESQL: true
      HIPAA_COMPLIANCE_MODE: true
      GDPR_COMPLIANCE_MODE: true
      HL7_PROCESSING_MODE: custom
      HL7_VALIDATION_LEVEL: basic
      VERBOSE_LOGGING: true
      
      # Add a flag to control dev data seeding
      SEED_DEV_DATA: "true"

      # ✅ FIXED: Schema paths that match the volume mounts
      EZHEALTHKONNECT_SCHEMA_DIR: /app/schemas
      FHIR_SCHEMA_DIR: /app/schemas/fhir
      # Local schema dist path for offline/dev install (points to sibling repo)
      SCHEMA_DIST_PATH: /app/schema-dist

      # Object Storage (MinIO — S3-compatible)
      OBJECT_STORAGE_DRIVER: s3
      OBJECT_STORAGE_BUCKET: ezhealthkonnect
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PATH_STYLE: "true"
      OBJECT_STORAGE_ACCESS_KEY: ezhealth_user
      OBJECT_STORAGE_SECRET_KEY: secure_password_change_me

      # Local AI — Ollama LLM inference (no PHI leaves the network)
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.2:3b   # 3B is ~3x faster than 8B on CPU-only Docker
      OLLAMA_EMBED_MODEL: nomic-embed-text

    ports:
      - "3000:3000"    # Node.js frontend
      - "8080:8080"    # Go backend API
      # Interface ports - TCP MLLP range (HL7 receivers)
      - "2575:2575"    # Alternative HL7 TCP port
      - "6610-6670:6610-6670"    # TCP MLLP port range for HL7 interfaces
      # Interface ports - HTTP range (FHIR/REST receivers)
      - "8081-8099:8081-8099"    # HTTP port range for FHIR/REST interfaces
    
    # ✅ FIXED: Complete volume mounting (was missing critical mounts)
    volumes:
      - ./public:/app/public
      - ./routes:/app/routes
      - ./services:/app/services
      - ./controllers:/app/controllers
      - ./middleware:/app/middleware
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./processing:/app/processing      # Go processing engine code
      # ✅ CRITICAL: These were missing in your broken config
      - ./hl7:/app/hl7                    # Go HL7 parsing code
      - ./schemas:/app/schemas             # HL7 and FHIR schema files (writable for package installs)
      - ../ezhealthkonnect-schemas:/app/schema-dist:ro  # Pre-built schema zips for offline install
      # Mount app.js so host changes are reflected without rebuilding the image
      - ./app.js:/app/app.js
      - ./server.js:/app/server.js
      # Mount main.go so Go routes (incl. git controller) are picked up at build time
      - ./main.go:/app/main.go
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./test-results:/app/test-results      # Test/sample files dropped here are accessible in container
      # ── Host file access for File Parser step ──────────────────────────────
      # Set HOST_DATA_PATH in your .env file (or export it) to mount a Windows
      # folder into the container so the File Parser can read your local files.
      # Example .env:  HOST_DATA_PATH=C:/Users/ShanawazKhan/Documents/HealthData
      # Inside the container the files appear at:  /mnt/host/
      - ${HOST_DATA_PATH:-C:/Users/Public}:/mnt/host
      # CCD/CDA file drop folder — files placed in C:\Projects\test on Windows
      # appear at /data/ccd/inbox inside the container
      - C:/Projects/test:/data/ccd/inbox

    # Wait for PostgreSQL, MinIO, and migrations to complete
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    
    command: >
      sh -c "
        (while true; do
          ./go-api;
          echo 'go-api exited (code $?), restarting in 3s...';
          sleep 3;
        done) &
        sleep 3 &&
        node server.js
      "
    restart: unless-stopped
    networks:
      - ezhealthkonnect

# Persistent storage for database data
volumes:
  # PostgreSQL persistent data
  postgres_data:
    driver: local

  # MinIO persistent data (object storage for raw messages, parsed content, logs)
  minio_data:
    driver: local


# Network for services to communicate
networks:
  ezhealthkonnect:
    driver: bridge