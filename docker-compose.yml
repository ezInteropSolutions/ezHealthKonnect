services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15
    container_name: ezhealthkonnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ezhealthkonnect
      POSTGRES_USER: ezhealth_user
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezhealth_user -d ezhealthkonnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezhealthkonnect

  # Your Application Service  
  app:
    build: .
    container_name: ezhealthkonnect-app
    environment:
      # Database connection - CHANGED to use Docker PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ezhealthkonnect
      DB_USER: ezhealth_user
      DB_PASSWORD: secure_password_change_me
      DB_SSL: false
      
      # Application settings (unchanged)
      API_PORT: 8080
      PORT: 3000
      NODE_ENV: development
      
      # Session secrets (unchanged)
      SESSION_SECRET: ezhealthkonnect_session_secret_key_for_development_1234567890123
      JWT_SECRET: ezhealthkonnect_jwt_secret_key_for_development_12345678901234567890
      
      # Feature flags (unchanged)
      ENABLE_POSTGRESQL: true
      HIPAA_COMPLIANCE_MODE: true
      GDPR_COMPLIANCE_MODE: true
      HL7_PROCESSING_MODE: custom
      HL7_VALIDATION_LEVEL: basic
      VERBOSE_LOGGING: true

      #EZHEALTHKONNECT_SCHEMA_DIR: /app/schemas
      EZHEALTHKONNECT_SCHEMA_DIR: /app/schemas/hl7
      FHIR_SCHEMA_DIR: /app/schemas/fhir             # Add this line



      
    ports:
      - "3000:3000"
      - "8080:8080"
    
    # Volume mounting (unchanged)
    volumes:
      - ./public:/app/public
      - ./routes:/app/routes
      - ./services:/app/services
      - ./controllers:/app/controllers
      - ./middleware:/app/middleware
      - ./config:/app/config
      - ./hl7:/app/hl7
      #- ${EZHEALTHKONNECT_SCHEMA_DIR}:/app/schemas:ro
      - ./schemas:/app/schemas:ro  # ✅ Direct mount of schemas directory


    
    # Wait for PostgreSQL to be ready before starting app
    depends_on:
      postgres:
        condition: service_healthy
    
    restart: unless-stopped
    networks:
      - ezhealthkonnect

# Persistent storage for PostgreSQL data
volumes:
  postgres_data:

# Network for services to communicate
networks:
  ezhealthkonnect:
    driver: bridge