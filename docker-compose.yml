services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15
    container_name: ezhealthkonnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ezhealthkonnect
      POSTGRES_USER: ezhealth_user
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      # PERSISTENT DATA - This survives docker-compose down
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezhealth_user -d ezhealthkonnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezhealthkonnect

  # MongoDB Database Service for Configuration Engine
  mongodb:
    image: mongo:7
    container_name: ezhealthkonnect-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ezhealth_user
      MONGO_INITDB_ROOT_PASSWORD: secure_password_change_me
      MONGO_INITDB_DATABASE: ezhealthkonnect
    ports:
      - "27017:27017"
    volumes:
      # Persistent data for MongoDB
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezhealthkonnect

  # Flyway handles SCHEMA migrations only (version controlled)
  flyway:
    image: flyway/flyway:latest
    container_name: ezhealthkonnect-flyway
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/ezhealthkonnect
      FLYWAY_USER: ezhealth_user
      FLYWAY_PASSWORD: secure_password_change_me
      FLYWAY_BASELINE_ON_MIGRATE: true
    volumes:
      # Only schema migrations (no data inserts)
      - ./database/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ezhealthkonnect
    command: ["repair", "migrate"]

  # Your Application Service - FIXED VERSION
  app:
    build: .
    container_name: ezhealthkonnect-app
    environment:
      # Database connection - CHANGED to use Docker PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ezhealthkonnect
      DB_USER: ezhealth_user
      DB_PASSWORD: secure_password_change_me
      DB_SSL: false
      
      # Application settings
      API_PORT: 8080
      PORT: 3000
      NODE_ENV: development
      
      # Session secrets
      SESSION_SECRET: ezhealthkonnect_session_secret_key_for_development_1234567890123
      JWT_SECRET: ezhealthkonnect_jwt_secret_key_for_development_12345678901234567890
      
      # Feature flags
      ENABLE_POSTGRESQL: true
      HIPAA_COMPLIANCE_MODE: true
      GDPR_COMPLIANCE_MODE: true
      HL7_PROCESSING_MODE: custom
      HL7_VALIDATION_LEVEL: basic
      VERBOSE_LOGGING: true
      
      # Add a flag to control dev data seeding
      SEED_DEV_DATA: "true"

      # ✅ FIXED: Schema paths that match the volume mounts
      EZHEALTHKONNECT_SCHEMA_DIR: /app/schemas/hl7
      FHIR_SCHEMA_DIR: /app/schemas/fhir

      # MongoDB Configuration Engine
      MONGODB_URI: mongodb://ezhealth_user:secure_password_change_me@mongodb:27017/ezhealthkonnect?authSource=admin
      MONGODB_DATABASE: ezhealthkonnect
      
    ports:
      - "3000:3000"    # Node.js frontend
      - "8080:8080"    # Go backend API
      # Interface ports (configured in database)
      - "6661:6661"    # Interface 1: HL7 TCP Receiver (primary)
      - "6662:6662"    # Interface 2: HL7 TCP Receiver (secondary)
      - "2575:2575"    # Interface 3: Alternative HL7 TCP port
      - "8081:8081"    # Interface 4: FHIR HTTP Receiver
      # Reserved ports for additional interfaces
      - "8090:8090"    # Interface 5
      - "8091:8091"    # Interface 6
      - "8092:8092"    # Interface 7
      - "8093:8093"    # Interface 8
      - "8094:8094"    # Interface 9
      - "8095:8095"    # Interface 10
      - "8096:8096"    # Interface 11
      - "8097:8097"    # Interface 12
    
    # ✅ FIXED: Complete volume mounting (was missing critical mounts)
    volumes:
      - ./public:/app/public
      - ./routes:/app/routes
      - ./services:/app/services
      - ./controllers:/app/controllers
      - ./middleware:/app/middleware
      - ./config:/app/config
      - ./scripts:/app/scripts
      # ✅ CRITICAL: These were missing in your broken config
      - ./hl7:/app/hl7                    # Go HL7 parsing code
      - ./schemas:/app/schemas:ro         # HL7 and FHIR schema files
      # Mount app.js for hot-reload (DISABLED - causes require() cache issues)
      # - ./app.js:/app/app.js
      # - ./server.js:/app/server.js
    
    # Wait for PostgreSQL, MongoDB, and migrations to complete
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    
    restart: unless-stopped
    networks:
      - ezhealthkonnect

# Persistent storage for database data
volumes:
  # PostgreSQL persistent data
  postgres_data:
    driver: local

  # MongoDB persistent data for Configuration Engine
  mongodb_data:
    driver: local

# Network for services to communicate
networks:
  ezhealthkonnect:
    driver: bridge