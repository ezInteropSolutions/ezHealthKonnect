services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15
    container_name: ezhealthkonnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ezhealthkonnect
      POSTGRES_USER: ezhealth_user
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      # PERSISTENT DATA - This survives docker-compose down
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezhealth_user -d ezhealthkonnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezhealthkonnect

  # MinIO — S3-compatible object storage for raw messages, parsed content, and logs
  minio:
    image: minio/minio:latest
    container_name: ezhealthkonnect-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ezhealth_user
      MINIO_ROOT_PASSWORD: secure_password_change_me
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console (browser UI)
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezhealthkonnect

  # Redis Cache Service for Database Enrichment Testing
  redis:
    image: redis:7-alpine
    container_name: ezhealthkonnect-redis
    restart: unless-stopped
    command: redis-server --requirepass secure_password_change_me
    ports:
      - "6379:6379"
    volumes:
      # Persistent data for Redis
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezhealthkonnect

  # MySQL Database for Enrichment Testing
  mysql:
    image: mysql:8.0
    container_name: ezhealthkonnect-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secure_password_change_me
      MYSQL_DATABASE: ezhealthkonnect
      MYSQL_USER: ezhealth_user
      MYSQL_PASSWORD: secure_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ezhealth_user", "-psecure_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezhealthkonnect

  # SQL Server Database for Enrichment Testing
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ezhealthkonnect-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: SecurePassword123!
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P SecurePassword123! -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezhealthkonnect

  # Oracle Database for Enrichment Testing
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: ezhealthkonnect-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: SecurePassword123
      APP_USER: ezhealth_user
      APP_USER_PASSWORD: secure_password_change_me
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s ezhealth_user/secure_password_change_me@//localhost:1521/FREEPDB1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ezhealthkonnect

  # Flyway handles SCHEMA migrations only (version controlled)
  flyway:
    image: flyway/flyway:latest
    container_name: ezhealthkonnect-flyway
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/ezhealthkonnect
      FLYWAY_USER: ezhealth_user
      FLYWAY_PASSWORD: secure_password_change_me
      FLYWAY_BASELINE_ON_MIGRATE: true
    volumes:
      # Only schema migrations (no data inserts)
      - ./database/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ezhealthkonnect
    command: ["repair", "migrate"]

  # Your Application Service - FIXED VERSION
  app:
    build: .
    container_name: ezhealthkonnect-app
    environment:
      # Database connection - CHANGED to use Docker PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ezhealthkonnect
      DB_USER: ezhealth_user
      DB_PASSWORD: secure_password_change_me
      DB_SSL: false
      
      # Application settings
      API_PORT: 8080
      PORT: 3000
      NODE_ENV: development
      
      # Session secrets
      SESSION_SECRET: ezhealthkonnect_session_secret_key_for_development_1234567890123
      JWT_SECRET: ezhealthkonnect_jwt_secret_key_for_development_12345678901234567890
      
      # Feature flags
      ENABLE_POSTGRESQL: true
      HIPAA_COMPLIANCE_MODE: true
      GDPR_COMPLIANCE_MODE: true
      HL7_PROCESSING_MODE: custom
      HL7_VALIDATION_LEVEL: basic
      VERBOSE_LOGGING: true
      
      # Add a flag to control dev data seeding
      SEED_DEV_DATA: "true"

      # ✅ FIXED: Schema paths that match the volume mounts
      EZHEALTHKONNECT_SCHEMA_DIR: /app/schemas/hl7
      FHIR_SCHEMA_DIR: /app/schemas/fhir

      # Object Storage (MinIO — S3-compatible)
      OBJECT_STORAGE_DRIVER: s3
      OBJECT_STORAGE_BUCKET: ezhealthkonnect
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PATH_STYLE: "true"
      OBJECT_STORAGE_ACCESS_KEY: ezhealth_user
      OBJECT_STORAGE_SECRET_KEY: secure_password_change_me

    ports:
      - "3000:3000"    # Node.js frontend
      - "8080:8080"    # Go backend API
      # Interface ports - TCP MLLP range (HL7 receivers)
      - "2575:2575"    # Alternative HL7 TCP port
      - "6610:6610"    # TCP MLLP port (HL7 interface)
      - "6661-6670:6661-6670"    # TCP MLLP port range for HL7 interfaces
      # Interface ports - HTTP range (FHIR/REST receivers)
      - "8081-8099:8081-8099"    # HTTP port range for FHIR/REST interfaces
    
    # ✅ FIXED: Complete volume mounting (was missing critical mounts)
    volumes:
      - ./public:/app/public
      - ./routes:/app/routes
      - ./services:/app/services
      - ./controllers:/app/controllers
      - ./middleware:/app/middleware
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./processing:/app/processing      # Go processing engine code
      # ✅ CRITICAL: These were missing in your broken config
      - ./hl7:/app/hl7                    # Go HL7 parsing code
      - ./schemas:/app/schemas:ro         # HL7 and FHIR schema files
      # Mount app.js for hot-reload (DISABLED - causes require() cache issues)
      # - ./app.js:/app/app.js
      # - ./server.js:/app/server.js
      - ./test-results:/app/test-results      # Test/sample files dropped here are accessible in container
      # ── Host file access for File Parser step ──────────────────────────────
      # Set HOST_DATA_PATH in your .env file (or export it) to mount a Windows
      # folder into the container so the File Parser can read your local files.
      # Example .env:  HOST_DATA_PATH=C:/Users/ShanawazKhan/Documents/HealthData
      # Inside the container the files appear at:  /mnt/host/
      - ${HOST_DATA_PATH:-C:/Users/Public}:/mnt/host
    
    # Wait for PostgreSQL, MinIO, and migrations to complete
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    
    command: >
      sh -c "
        echo 'Compiling Go...' &&
        go build -o go-api main.go &&
        echo 'Go build complete' &&
        (while true; do
          ./go-api;
          echo 'go-api exited (code $?), restarting in 3s...';
          sleep 3;
        done) &
        sleep 5 &&
        node server.js
      "
    restart: unless-stopped
    networks:
      - ezhealthkonnect

# Persistent storage for database data
volumes:
  # PostgreSQL persistent data
  postgres_data:
    driver: local

  # MinIO persistent data (object storage for raw messages, parsed content, logs)
  minio_data:
    driver: local

  # Redis persistent data for enrichment testing
  redis_data:
    driver: local

  # MySQL persistent data for enrichment testing
  mysql_data:
    driver: local

  # SQL Server persistent data for enrichment testing
  sqlserver_data:
    driver: local

  # Oracle persistent data for enrichment testing
  oracle_data:
    driver: local

# Network for services to communicate
networks:
  ezhealthkonnect:
    driver: bridge