# docker-compose.linux.yml
# Linux production stack — uses host networking for the app service.
#
# WHY HOST NETWORKING?
# With network_mode: host, the app container shares the Linux host's network
# stack directly. Any port you configure in the ezHealthKonnect UI is
# immediately reachable — no port mapping, no configuration changes, no restart.
# This is how Mirth Connect and most native integration engines behave.
#
# NOT FOR WINDOWS/MAC:
# Docker Desktop (Windows/Mac) runs containers inside a Linux VM, so host
# networking does not reach the Windows/Mac host. Use the standalone installer
# on Windows, or docker-compose.prod.yml with the pre-mapped port ranges.
#
# Usage:
#   docker compose -f docker-compose.linux.yml up -d
#   docker compose -f docker-compose.linux.yml --profile ai up -d   # with Ollama
#
# All ${...} variables are read from the .env file in the same directory.

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ezhk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ezhealthkonnect
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # Localhost-only — reachable by the host-networked app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ezhealthkonnect"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ezhk-internal

  # ── Flyway migrations ───────────────────────────────────────────────────────
  flyway:
    image: flyway/flyway:10-alpine
    container_name: ezhk-flyway
    environment:
      FLYWAY_URL:                  jdbc:postgresql://postgres:5432/ezhealthkonnect
      FLYWAY_USER:                 ${DB_USER}
      FLYWAY_PASSWORD:             ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE:  "true"
      FLYWAY_CONNECT_RETRIES:      10
    volumes:
      - ./database/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["repair", "migrate"]
    networks:
      - ezhk-internal

  # ── MinIO object storage ────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ezhk-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API — reachable by the host-networked app
      - "127.0.0.1:9001:9001"   # MinIO console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ezhk-internal

  # ── Ollama local LLM (optional — activate with --profile ai) ───────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ezhk-ollama
    restart: unless-stopped
    profiles:
      - ai
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ezhk-internal

  # ── Application ─────────────────────────────────────────────────────────────
  # network_mode: host means this container IS the host network.
  # Any port the Go backend opens (e.g. 6601, 2575, 8082) is instantly
  # reachable — no port declarations, no restarts, no docker-compose changes.
  app:
    image: ${APP_IMAGE:-shanawaz107/ezhealthkonnect:latest}
    container_name: ezhk-app
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production

      # Postgres is port-forwarded to 127.0.0.1:5432 — reachable via localhost
      DB_HOST:     127.0.0.1
      DB_PORT:     5432
      DB_NAME:     ezhealthkonnect
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL:      ${DB_SSL:-false}

      PORT:     3000
      API_PORT: 8080

      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET:     ${JWT_SECRET}

      # MinIO is port-forwarded to 127.0.0.1:9000 — reachable via localhost
      OBJECT_STORAGE_DRIVER:     s3
      OBJECT_STORAGE_BUCKET:     ezhealthkonnect
      OBJECT_STORAGE_REGION:     us-east-1
      OBJECT_STORAGE_ENDPOINT:   http://127.0.0.1:9000
      OBJECT_STORAGE_PATH_STYLE: "true"
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_PASSWORD}

      OLLAMA_HOST:        http://127.0.0.1:11434
      OLLAMA_CHAT_MODEL:  ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}

      EZHEALTHKONNECT_SCHEMA_DIR: /app/schemas
      HIPAA_COMPLIANCE_MODE: "true"
      GDPR_COMPLIANCE_MODE:  "true"

    volumes:
      - schemas_data:/app/schemas
      - logs_data:/app/logs
      - uploads_data:/app/uploads

    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# ── Named volumes ───────────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  ollama_data:
  schemas_data:
  logs_data:
  uploads_data:

# ── Internal network (app excluded — it uses host networking) ───────────────
networks:
  ezhk-internal:
    driver: bridge
