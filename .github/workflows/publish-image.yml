name: Docker Image — Build and Security Scan (development only)

# Docker is used for local development and CI only; customers install the
# Standalone edition. This builds the dev image and scans it — it contains the
# same node_modules and go-api the Standalone bundle ships, so Trivy findings
# apply to both. Nothing is published.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  LOCAL_TAG: ezhealthkonnect-ci:${{ github.run_id }}

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3018

  # ── Job 2: Build → Scan → Smoke Test → Push ───────────────────────────────
  build-validate-push:
    name: Build and Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Build (local only) ────────────────────────────────────────────────
      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.LOCAL_TAG }}
          no-cache: true

      # ── Layer inspection: no secrets baked in ────────────────────────────
      - name: Check for secrets in image layers
        run: |
          echo "=== Checking image history for hardcoded secret values ==="
          docker history --no-trunc ${{ env.LOCAL_TAG }} | grep -iE \
            '(password|secret|credential|api_key)\s*=\s*\S+' \
            && echo "FAIL: Potential hardcoded secret found in image history" && exit 1 \
            || echo "OK: No hardcoded secrets detected in image history"

          echo ""
          echo "=== Verifying .env is NOT baked into image ==="
          docker run --rm --entrypoint "" ${{ env.LOCAL_TAG }} sh -c \
            'test -f /app/.env && echo "FAIL: .env found in image" && exit 1 || echo "OK: No .env in image"'

          echo ""
          echo "=== Verifying .git is NOT baked into image ==="
          docker run --rm --entrypoint "" ${{ env.LOCAL_TAG }} sh -c \
            'test -d /app/.git && echo "FAIL: .git found in image" && exit 1 || echo "OK: No .git in image"'

      # ── CVE scan with Trivy ───────────────────────────────────────────────
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version

      # Full findings — informational.
      - name: Trivy scan (full, informational)
        run: |
          trivy image \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            ${{ env.LOCAL_TAG }} || true

      # Enforced scan — blocks on fixable CVEs not suppressed in .trivyignore.
      - name: Trivy scan (enforced — blocks on fixable CVEs)
        run: |
          trivy image \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            ${{ env.LOCAL_TAG }}

      # ── Smoke test: container starts and binaries run ─────────────────────
      - name: Smoke test — binaries present and executable
        run: |
          echo "=== Checking go-api binary ==="
          docker run --rm --entrypoint "" ${{ env.LOCAL_TAG }} sh -c \
            'test -x /app/go-api && echo "OK: go-api binary is present and executable"'

          echo "=== Checking Node.js ==="
          docker run --rm --entrypoint "" ${{ env.LOCAL_TAG }} node --version

          echo "=== Checking curl (health check tool) ==="
          docker run --rm --entrypoint "" ${{ env.LOCAL_TAG }} curl --version | head -1

      # ── Image report ──────────────────────────────────────────────────────
      - name: Print image size report
        if: always()
        run: |
          echo "=== Image size ==="
          docker images ${{ env.LOCAL_TAG }} --format "Size: {{.Size}}"
          echo ""
          echo "=== Layer breakdown (top 10 largest) ==="
          docker history ${{ env.LOCAL_TAG }} --format "{{.Size}}\t{{.CreatedBy}}" \
            | sort -rh | head -10
