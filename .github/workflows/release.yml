name: Release — Build and Publish Installers

# Triggered when a version tag is pushed: git tag v1.0.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v0.0.0-test'

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '20'

jobs:
  # ── Job 0: Pre-flight checks ──────────────────────────────────────────────────
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Go build check
        run: go build $(go list ./... | grep -v '/tests')

      - name: Go vet
        run: go vet $(go list ./... | grep -v '/tests')

      - name: Node.js install check
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm install
        run: npm ci --prefer-offline

  # ── Job 1: Build go-api binaries ─────────────────────────────────────────────
  build-go-api:
    needs: preflight
    name: Build go-api binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: go-api
          - goos: linux
            goarch: arm64
            output: go-api-arm64
          - goos: windows
            goarch: amd64
            output: go-api.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build go-api (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.value }}" \
            -o dist/${{ matrix.output }} \
            .

      - name: Upload go-api artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.output }}
          retention-days: 1

  # ── Job 2: Package app bundles ────────────────────────────────────────────────
  build-app-bundles:
    name: Package app bundles
    runs-on: ubuntu-latest
    needs: build-go-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download go-api (Linux amd64)
        uses: actions/download-artifact@v4
        with:
          name: go-api-linux-amd64
          path: dist-go/linux-amd64/

      - name: Download go-api (Linux arm64)
        uses: actions/download-artifact@v4
        with:
          name: go-api-linux-arm64
          path: dist-go/linux-arm64/

      - name: Download go-api (Windows)
        uses: actions/download-artifact@v4
        with:
          name: go-api-windows-amd64
          path: dist-go/windows-amd64/

      - name: Make go-api binaries executable
        run: |
          chmod +x dist-go/linux-amd64/go-api
          chmod +x dist-go/linux-arm64/go-api-arm64

      - name: Build app source (npm install --production)
        run: npm install --omit=dev

      - name: Package Linux amd64 bundle
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          BUNDLE_DIR="ezhealthkonnect-${VERSION}"
          mkdir -p "${BUNDLE_DIR}"

          rsync -a \
            --exclude='node_modules/.cache' \
            --exclude='.git' \
            --exclude='.env*' \
            --exclude='logs/' \
            --exclude='installer/' \
            --exclude='architecture/' \
            --exclude='docs/' \
            --exclude='connectivity/' \
            --exclude='tests/' \
            --exclude='*.test.js' \
            --exclude='go-api' \
            --exclude='go-api-linux' \
            --exclude='go-api.exe' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='dist-go/' \
            . "${BUNDLE_DIR}/"

          cp dist-go/linux-amd64/go-api "${BUNDLE_DIR}/go-api"
          chmod +x "${BUNDLE_DIR}/go-api"

          tar -czf "ezhealthkonnect-linux-amd64.tar.gz" "${BUNDLE_DIR}/"
          echo "Linux amd64 bundle: $(du -sh ezhealthkonnect-linux-amd64.tar.gz | cut -f1)"

      - name: Package Linux arm64 bundle
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          BUNDLE_DIR="ezhealthkonnect-${VERSION}"

          cp dist-go/linux-arm64/go-api-arm64 "${BUNDLE_DIR}/go-api"
          chmod +x "${BUNDLE_DIR}/go-api"

          tar -czf "ezhealthkonnect-linux-arm64.tar.gz" "${BUNDLE_DIR}/"
          echo "Linux arm64 bundle: $(du -sh ezhealthkonnect-linux-arm64.tar.gz | cut -f1)"

      - name: Package Windows bundle
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          BUNDLE_DIR="ezhealthkonnect-${VERSION}"

          cp dist-go/windows-amd64/go-api.exe "${BUNDLE_DIR}/go-api.exe"
          rm -f "${BUNDLE_DIR}/go-api"

          zip -r "ezhealthkonnect-windows-amd64.zip" "${BUNDLE_DIR}/" -q
          echo "Windows bundle: $(du -sh ezhealthkonnect-windows-amd64.zip | cut -f1)"

      - name: Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: app-bundles
          path: |
            ezhealthkonnect-linux-amd64.tar.gz
            ezhealthkonnect-linux-arm64.tar.gz
            ezhealthkonnect-windows-amd64.zip
          retention-days: 1

  # ── Job 3: Build installer binaries ──────────────────────────────────────────
  build-installers:
    name: Build installer binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # installer module has no external deps — no go.sum needed

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Windows installer (.exe)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          cd installer
          go build \
            -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.value }}" \
            -o ../dist/ezhealthkonnect-installer.exe \
            .

      - name: Build Linux installer
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cd installer
          go build \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.value }}" \
            -o ../dist/ezhealthkonnect-installer-linux \
            .
          chmod +x ../dist/ezhealthkonnect-installer-linux

      - name: Copy install.sh
        run: cp installer/install.sh dist/install.sh && chmod +x dist/install.sh

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/
          retention-days: 1

  # ── Job 4: Create GitHub Release ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-app-bundles, build-installers]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p final
          find release-assets/ -type f | while read f; do
            cp "$f" final/
          done
          ls -lh final/

      - name: Create checksums
        working-directory: final
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Generate release notes
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          cat > release-notes.md << NOTES
          ## Installation

          ### Linux — Standalone (no Docker required)
          \`\`\`bash
          curl -fsSL https://github.com/ezInteropSolutions/ezHealthKonnect/releases/download/${VERSION}/install.sh | sudo bash
          \`\`\`

          ### Windows — Setup Wizard
          Download \`ezhealthkonnect-installer.exe\` and run it. Choose **Docker Edition** or **Standalone Edition** in the wizard.

          ### Linux — Docker Edition
          \`\`\`bash
          curl -fsSL -o ezhealthkonnect-installer \\
            https://github.com/ezInteropSolutions/ezHealthKonnect/releases/download/${VERSION}/ezhealthkonnect-installer-linux
          chmod +x ezhealthkonnect-installer && ./ezhealthkonnect-installer
          \`\`\`

          ---

          See [INSTALL.md](https://github.com/ezInteropSolutions/ezHealthKonnect/blob/master/INSTALL.md) for full documentation.

          ## Assets

          | File | Description |
          |------|-------------|
          | \`ezhealthkonnect-installer.exe\` | Windows setup wizard |
          | \`ezhealthkonnect-installer-linux\` | Linux Docker Edition wizard |
          | \`install.sh\` | Linux standalone one-liner |
          | \`ezhealthkonnect-linux-amd64.tar.gz\` | App bundle — Linux x86_64 |
          | \`ezhealthkonnect-linux-arm64.tar.gz\` | App bundle — Linux ARM64 |
          | \`ezhealthkonnect-windows-amd64.zip\` | App bundle — Windows |
          | \`SHA256SUMS.txt\` | File checksums |
          NOTES

      # Delete existing release for this tag if one exists (handles re-runs and re-tags)
      - name: Delete existing release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          if gh release view "${VERSION}" &>/dev/null; then
            echo "Deleting existing release for ${VERSION}"
            gh release delete "${VERSION}" --yes
          else
            echo "No existing release for ${VERSION} — creating fresh"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.value }}
          name: "ezHealthKonnect ${{ steps.ver.outputs.value }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.value, '-beta') || contains(steps.ver.outputs.value, '-rc') || contains(steps.ver.outputs.value, '-alpha') }}
          files: |
            final/ezhealthkonnect-installer.exe
            final/ezhealthkonnect-installer-linux
            final/install.sh
            final/ezhealthkonnect-linux-amd64.tar.gz
            final/ezhealthkonnect-linux-arm64.tar.gz
            final/ezhealthkonnect-windows-amd64.zip
            final/SHA256SUMS.txt
