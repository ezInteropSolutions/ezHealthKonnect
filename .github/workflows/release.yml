name: Release — Build and Publish Installers

# Triggered by a version tag push or manually via workflow_dispatch.
# Produces self-contained installers for Windows and Linux — no internet
# required on the target machine during installation.
#
# Cross-publish to a public releases repo requires two repo settings:
#   Secret:   RELEASES_PAT  — PAT with 'repo' scope on the public repo
#   Variable: RELEASES_REPO — e.g. "ezInteropSolutions/ezhealthkonnect-releases"
# Set these in: Settings → Secrets and variables → Actions

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v0.0.0-test'

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  # ── Job 0: Pre-flight checks ──────────────────────────────────────────────────
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Tidy go.sum
        run: go mod tidy

      - name: Go build check
        run: go build $(go list ./... | grep -v '/tests')

      - name: Go vet
        run: go vet $(go list ./... | grep -v '/tests')

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm install check
        run: npm ci --prefer-offline

  # ── Job 1: Build go-api binaries ─────────────────────────────────────────────
  build-go-api:
    name: Build go-api (${{ matrix.goos }})
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: go-api
          - goos: windows
            goarch: amd64
            output: go-api.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Tidy go.sum
        run: go mod tidy

      - name: Build go-api
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.value }}" \
            -o dist/${{ matrix.output }} \
            .
          echo "go-api (${{ matrix.goos }}): $(du -sh dist/${{ matrix.output }} | cut -f1)"

      - name: Upload go-api artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-api-${{ matrix.goos }}
          path: dist/${{ matrix.output }}
          retention-days: 1

  # ── Job 2: Build embedded Windows installer ───────────────────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: ubuntu-latest
    needs: build-go-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download go-api.exe
        uses: actions/download-artifact@v4
        with:
          name: go-api-windows
          path: dist/

      - name: Assemble Windows bundle
        run: |
          BUNDLE_DIR=$(mktemp -d)/ezhealthkonnect
          mkdir -p "$BUNDLE_DIR"

          # Core app files
          for f in app.js server.js package.json package-lock.json go.mod go.sum \
                   Dockerfile docker-compose.prod.yml docker-compose.yml \
                   COMMERCIAL_LICENSE.md THIRD-PARTY-NOTICES.txt; do
            [ -f "$f" ] && cp "$f" "$BUNDLE_DIR/" || true
          done

          # Runtime directories
          for d in controllers services middleware routes config models \
                   processing utils public fhir hl7 cda templates; do
            [ -d "$d" ] && cp -r "$d" "$BUNDLE_DIR/" || true
          done

          # Database migrations
          mkdir -p "$BUNDLE_DIR/database/migrations"
          cp database/migrations/*.sql "$BUNDLE_DIR/database/migrations/"

          # go-api.exe binary
          cp dist/go-api.exe "$BUNDLE_DIR/go-api.exe"

          # Bundle node_modules — installer skips npm at install time when present
          npm install --omit=dev --prefix "$BUNDLE_DIR" --silent
          echo "node_modules: $(du -sh $BUNDLE_DIR/node_modules | cut -f1)"

          # Zip into installer/assets/bundle-windows.zip (matches //go:embed directive)
          BUNDLE_ZIP="$GITHUB_WORKSPACE/installer/assets/bundle-windows.zip"
          mkdir -p "$GITHUB_WORKSPACE/installer/assets"
          (cd "$(dirname $BUNDLE_DIR)" && zip -r -q "$BUNDLE_ZIP" ezhealthkonnect)
          echo "bundle-windows.zip: $(du -sh $BUNDLE_ZIP | cut -f1)"

      - name: Build embedded Windows installer
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          cd installer
          go build \
            -tags embedded \
            -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.value }}" \
            -o ../dist/ezHealthKonnect-Setup-Win64.exe \
            .
          echo "Windows installer: $(du -sh ../dist/ezHealthKonnect-Setup-Win64.exe | cut -f1)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/ezHealthKonnect-Setup-Win64.exe
          retention-days: 1

  # ── Job 3: Build embedded Linux installer ─────────────────────────────────────
  build-linux:
    name: Build Linux Installer
    runs-on: ubuntu-latest
    needs: build-go-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download go-api (Linux)
        uses: actions/download-artifact@v4
        with:
          name: go-api-linux
          path: dist/

      - name: Assemble Linux bundle
        run: |
          chmod +x dist/go-api

          BUNDLE_DIR=$(mktemp -d)/ezhealthkonnect
          mkdir -p "$BUNDLE_DIR"

          # Core app files
          for f in app.js server.js package.json package-lock.json go.mod go.sum \
                   COMMERCIAL_LICENSE.md THIRD-PARTY-NOTICES.txt; do
            [ -f "$f" ] && cp "$f" "$BUNDLE_DIR/" || true
          done

          # Runtime directories
          for d in controllers services middleware routes config models \
                   processing utils public fhir hl7 cda templates; do
            [ -d "$d" ] && cp -r "$d" "$BUNDLE_DIR/" || true
          done

          # Database migrations
          mkdir -p "$BUNDLE_DIR/database/migrations"
          cp database/migrations/*.sql "$BUNDLE_DIR/database/migrations/"

          # go-api binary
          cp dist/go-api "$BUNDLE_DIR/go-api"
          chmod +x "$BUNDLE_DIR/go-api"

          # Bundle node_modules — installer skips npm at install time when present
          npm install --omit=dev --prefix "$BUNDLE_DIR" --silent
          echo "node_modules: $(du -sh $BUNDLE_DIR/node_modules | cut -f1)"

          # Zip into installer/assets/bundle-linux-amd64.zip (matches //go:embed directive)
          BUNDLE_ZIP="$GITHUB_WORKSPACE/installer/assets/bundle-linux-amd64.zip"
          mkdir -p "$GITHUB_WORKSPACE/installer/assets"
          (cd "$(dirname $BUNDLE_DIR)" && zip -r -q "$BUNDLE_ZIP" ezhealthkonnect)
          echo "bundle-linux-amd64.zip: $(du -sh $BUNDLE_ZIP | cut -f1)"

      - name: Build embedded Linux installer
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          cd installer
          go build \
            -tags embedded \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.value }}" \
            -o ../dist/ezHealthKonnect-Setup-Linux-x64 \
            .
          chmod +x ../dist/ezHealthKonnect-Setup-Linux-x64
          echo "Linux installer: $(du -sh ../dist/ezHealthKonnect-Setup-Linux-x64 | cut -f1)"

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/ezHealthKonnect-Setup-Linux-x64
          retention-days: 1

  # ── Job 4: Publish release ────────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: final/

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: final/

      - name: Create checksums
        working-directory: final
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Generate release notes
        run: |
          VERSION="${{ steps.ver.outputs.value }}"

          # Commits since previous tag (or all commits for the very first release)
          PREV_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${VERSION}"
          else
            RANGE="HEAD"
          fi

          # Categorise by conventional-commit prefix
          FEATURES=$(git log $RANGE --oneline --no-decorate | grep -E '^[0-9a-f]+ feat' || true)
          FIXES=$(git log $RANGE --oneline --no-decorate | grep -E '^[0-9a-f]+ fix' || true)
          OTHER=$(git log $RANGE --oneline --no-decorate | grep -vE '^[0-9a-f]+ (feat|fix|chore|docs|test|ci|refactor|perf|style)' || true)
          CHORE=$(git log $RANGE --oneline --no-decorate | grep -E '^[0-9a-f]+ (chore|refactor|perf)' || true)

          {
            if [ -n "$FEATURES" ]; then
              echo "## New Features"
              echo "$FEATURES" | sed 's/^[0-9a-f]* feat[^:]*: /- /'
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              echo "## Bug Fixes"
              echo "$FIXES" | sed 's/^[0-9a-f]* fix[^:]*: /- /'
              echo ""
            fi

            if [ -n "$CHORE" ]; then
              echo "## Internals"
              echo "$CHORE" | sed 's/^[0-9a-f]* [a-z]*[^:]*: /- /'
              echo ""
            fi

            if [ -n "$OTHER" ]; then
              echo "## Other Changes"
              echo "$OTHER" | sed 's/^[0-9a-f]* /- /'
              echo ""
            fi

            if [ -n "$PREV_TAG" ]; then
              echo "**Full diff**: [\`${PREV_TAG}..${VERSION}\`](../../compare/${PREV_TAG}...${VERSION})"
              echo ""
            fi

            echo "---"
            echo ""
            echo "## Installation"
            echo ""
            echo "### Windows — Setup Wizard"
            echo "1. Download \`ezHealthKonnect-Setup-Win64.exe\`"
            echo "2. Run it (right-click → Run as administrator if prompted)"
            echo "3. Follow the on-screen setup wizard"
            echo ""
            echo "### Linux — Setup Wizard"
            echo '```bash'
            echo "chmod +x ezHealthKonnect-Setup-Linux-x64"
            echo "sudo ./ezHealthKonnect-Setup-Linux-x64"
            echo '```'
            echo "Supports Ubuntu 20.04+, Rocky Linux 8/9, RHEL 8/9, and other systemd-based distros."
            echo ""
            echo "Both installers are **self-contained** — PostgreSQL, Node.js, and all application"
            echo "dependencies are included. No internet connection required during installation."
            echo ""
            echo "---"
            echo ""
            echo "## Assets"
            echo ""
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`ezHealthKonnect-Setup-Win64.exe\` | Windows self-contained installer |"
            echo "| \`ezHealthKonnect-Setup-Linux-x64\` | Linux self-contained installer |"
            echo "| \`SHA256SUMS.txt\` | File checksums for verification |"
          } > release-notes.md

      # ── Private repo release (internal tracking) ──────────────────────────────
      - name: Delete existing private release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          gh release view "$VERSION" &>/dev/null && \
            gh release delete "$VERSION" --yes || true

      - name: Publish to private repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.value }}
          name: "ezHealthKonnect ${{ steps.ver.outputs.value }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.value, '-beta') || contains(steps.ver.outputs.value, '-rc') || contains(steps.ver.outputs.value, '-alpha') }}
          files: |
            final/ezHealthKonnect-Setup-Win64.exe
            final/ezHealthKonnect-Setup-Linux-x64
            final/SHA256SUMS.txt

      # ── Public releases repo (user-facing download) ───────────────────────────
      # Skipped if RELEASES_REPO variable is not set.
      - name: Cross-publish to public releases repo
        if: ${{ vars.RELEASES_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          REPO="${{ vars.RELEASES_REPO }}"
          IS_PRE="${{ contains(steps.ver.outputs.value, '-beta') || contains(steps.ver.outputs.value, '-rc') || contains(steps.ver.outputs.value, '-alpha') }}"

          # Remove existing release for this tag if any
          gh release view "$VERSION" --repo "$REPO" &>/dev/null && \
            gh release delete "$VERSION" --repo "$REPO" --yes || true

          PRE_FLAG=""
          [ "$IS_PRE" = "true" ] && PRE_FLAG="--prerelease"

          gh release create "$VERSION" \
            --repo "$REPO" \
            --title "ezHealthKonnect $VERSION" \
            --notes-file release-notes.md \
            $PRE_FLAG \
            final/ezHealthKonnect-Setup-Win64.exe \
            final/ezHealthKonnect-Setup-Linux-x64 \
            final/SHA256SUMS.txt

          echo ""
          echo "Public release published:"
          echo "  https://github.com/$REPO/releases/tag/$VERSION"
          echo ""
          echo "Direct download links:"
          echo "  https://github.com/$REPO/releases/download/$VERSION/ezHealthKonnect-Setup-Win64.exe"
          echo "  https://github.com/$REPO/releases/download/$VERSION/ezHealthKonnect-Setup-Linux-x64"

      # ── Cleanup intermediate artifacts ────────────────────────────────────────
      - name: Delete intermediate artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for artifact in go-api-linux go-api-windows installer-windows installer-linux; do
            ID=$(gh api repos/${{ github.repository }}/actions/artifacts \
              --jq ".artifacts[] | select(.name==\"${artifact}\" and .workflow_run.id==${{ github.run_id }}) | .id" \
              2>/dev/null || true)
            if [ -n "$ID" ]; then
              gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/$ID
              echo "Deleted: ${artifact}"
            fi
          done
