name: CI — Build Checks

# Runs on every push and every pull request.
# Purpose: catch broken Go/Node.js builds and obvious errors early,
# before they reach the release pipeline.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  # ── Go backend ────────────────────────────────────────────────────────────────
  check-go:
    name: Go build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Tidy go.sum
        run: go mod tidy

      - name: Build go-api
        run: go build $(go list ./... | grep -v '/tests')

      - name: Vet
        run: go vet $(go list ./... | grep -v '/tests')

      - name: govulncheck
        # Scans for known vulnerabilities in the module graph AND reports whether
        # this codebase's own call graph actually reaches the vulnerable code path
        # (not just "a dependency somewhere has a CVE"). Security audit (2026-07)
        # found 8 real, reachable vulnerabilities in golang.org/x/crypto and
        # github.com/redis/go-redis/v9 this way — both fixed by dependency bumps.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # ── Go test suite ────────────────────────────────────────────────────────────
  # check-go above only builds/vets/scans — it never actually runs `go test`.
  # validate-fhir below runs a real suite, but scoped to one narrow -run pattern
  # in one package. This job runs the full suite (hundreds of tests across
  # dozens of packages) that previously only ran when a human remembered to
  # type the command by hand.
  test-go:
    name: Go test suite
    runs-on: ubuntu-latest
    services:
      # Mirrors docker-compose.yml's postgres service (same DB name/user/password)
      # so DB-touching tests get a real schema to run against, not just the
      # nil-DB safety-branch tests that make up most of the suite today.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ezhealthkonnect
          POSTGRES_USER: ezhealth_user
          POSTGRES_PASSWORD: secure_password_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ezhealth_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install schema packages (HL7 v2.5.1 + FHIR R4 base/US Core)
        # schemas/hl7/, schemas/fhir/R4/{resources,profiles,valuesets}/ are
        # gitignored (see schemas/catalog.json + services/schema/
        # schema_package_manager.go: "the app ships with NO schemas bundled").
        # A fresh CI checkout has none of them, so hl7/real_schema_parser.go's
        # loader — which every real HL7-parse/FHIR-build test goes through —
        # finds nothing and every validation code path silently no-ops. Fetch
        # the same public release assets a real install downloads via the
        # Settings UI, straight from the URLs already recorded in
        # schemas/catalog.json (single source of truth, not re-hardcoded here).
        run: |
          set -euo pipefail
          for id in fhir-r4-base fhir-r4-us-core hl7-v2-25; do
            url=$(jq -r --arg id "$id" '.[] | select(.id==$id) | .download_url' schemas/catalog.json)
            echo "Installing $id from $url"
            curl -sSL "$url" -o "/tmp/$id.zip"
            unzip -q -o "/tmp/$id.zip" -d schemas/
          done

      - name: Run Flyway migrations
        # Mirrors docker-compose.yml's flyway service (same URL shape, user/
        # password, baselineOnMigrate/placeholderReplacement flags, repair+
        # migrate command) — pointed at localhost since GitHub Actions service
        # containers publish ports directly to the runner host, unlike the
        # docker-compose network where services address each other by name.
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/database/migrations:/flyway/sql \
            flyway/flyway:latest \
            -url=jdbc:postgresql://localhost:5432/ezhealthkonnect \
            -user=ezhealth_user \
            -password=secure_password_change_me \
            -baselineOnMigrate=true \
            -placeholderReplacement=false \
            repair migrate

      - name: Run Go test suite
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: ezhealthkonnect
          DB_USER: ezhealth_user
          DB_PASSWORD: secure_password_change_me
          DB_SSL: 'false'
          # Gates the small number of real-DB integration tests (e.g.
          # TestTransformIntegration_*) that need more than the nil-DB safety
          # branch — same DATABASE_URL convention already established in
          # services/mirth_migration_service_test.go. Unset, these tests
          # skip rather than fail.
          DATABASE_URL: postgres://ezhealth_user:secure_password_change_me@localhost:5432/ezhealthkonnect?sslmode=disable
        # If a specific package is later found to need MongoDB/Ollama (neither
        # provisioned here) with no nil-safety fallback, exclude it explicitly
        # by name here — matching this repo's existing convention (see the
        # `grep -v '/tests'` pattern above) of naming scope exclusions rather
        # than silently skipping them.
        run: go test -timeout 300s $(go list ./... | grep -v '/tests')

  # ── Go installer ──────────────────────────────────────────────────────────────
  check-installer:
    name: Installer build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build installer (Linux)
        working-directory: installer
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Build installer (Windows cross-compile)
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./...

  # ── Node.js frontend ──────────────────────────────────────────────────────────
  check-node:
    name: Node.js dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Check for secrets accidentally staged
        run: |
          if git show HEAD:.env 2>/dev/null; then
            echo "ERROR: .env file was committed — remove it immediately"
            exit 1
          fi
          echo "OK: .env is not in the repository"

  # ── Node.js test suite ────────────────────────────────────────────────────────
  # check-node above is a security gate (npm audit) — this is a correctness gate,
  # kept as its own job per this project's one-job-per-concern convention (see
  # test-go vs check-go). Runs the Jest suite in tests/unit/ — currently pure
  # logic only (auth middleware, rate limiter, HL7 field extraction, credential
  # sanitization, and the pure-data-shaping halves of two DB-coupled services),
  # so no services: block/Postgres needed here, unlike test-go/test-e2e.
  test-node:
    name: Node.js test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run Jest suite
        run: npm test

  # ── Secret scanning ──────────────────────────────────────────────────────────
  # Scans the current working tree (--no-git), not git history — this is what
  # actually avoids re-flagging old, already-reviewed example values that still
  # exist in current files (see .gitleaks.toml's allowlist for the two known
  # ones), with no "since last successful scan" state to track ourselves.
  #
  # gitleaks/gitleaks-action@v2 (the previous approach here) started requiring
  # a paid GITLEAKS_LICENSE for this kind of use — switched to invoking the
  # free, open-source (Apache-2.0) gitleaks CLI binary directly instead, same
  # underlying scanner and the same .gitleaks.toml config, no license needed.
  scan-secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks
        run: gitleaks detect --source . --no-git -v --redact

  # ── FHIR US Core profile validation ──────────────────────────────────────────
  validate-fhir:
    name: FHIR US Core profile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Tidy go.sum
        run: go mod tidy

      - name: Run US Core conformance tests
        # Validates that every FHIR resource produced by the hl7assembly package
        # satisfies the SHALL rules of the relevant US Core R4 profile:
        #   Patient, Observation Lab, DiagnosticReport Lab, Immunization,
        #   DocumentReference.
        # No database or running server required — assembly functions are called
        # directly with synthetic HL7 segment data.
        run: go test -v -count=1 -run 'USCore|Assembly.*USCore|FHIR' ./services/hl7assembly/...

  # ── Playwright E2E suite ──────────────────────────────────────────────────────
  # The ~300-test suite in tests/playwright/ previously only ran when a human
  # remembered to type the command by hand — this job is what actually closes
  # that gap. Gated on check-go/check-node so a broken build fails fast instead
  # of burning 10+ minutes standing up the full docker-compose stack first.
  test-e2e:
    name: Playwright E2E suite
    runs-on: ubuntu-latest
    needs: [check-go, check-node]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies + Playwright browsers
        run: |
          npm ci --prefer-offline
          npx playwright install --with-deps chromium

      - name: Install schema packages (HL7 v2.5.1 + FHIR R4 base/US Core)
        # Same gap as test-go's identically-named step: schemas/hl7/ and
        # schemas/fhir/R4/{resources,profiles,valuesets}/ are gitignored, and
        # docker-compose.yml bind-mounts ./schemas into the app container — so
        # without this, the container starts with an empty schema dir and every
        # validation-dependent Playwright spec (hl7-reader-validation.spec.js,
        # etc.) fails the same way the Go tests do. Must run before the stack
        # starts since the mount is read at container start, not on every request.
        run: |
          set -euo pipefail
          for id in fhir-r4-base fhir-r4-us-core hl7-v2-25; do
            url=$(jq -r --arg id "$id" '.[] | select(.id==$id) | .download_url' schemas/catalog.json)
            echo "Installing $id from $url"
            curl -sSL "$url" -o "/tmp/$id.zip"
            unzip -q -o "/tmp/$id.zip" -d schemas/
          done

      - name: Start app stack
        # Deliberately starts only postgres/minio/ollama/flyway/app — skips
        # ollama-init, which pulls llama3.2:3b + nomic-embed-text (multi-GB) on
        # every cold start with no pre-warmed volume. Confirmed via
        # docker-compose.yml: app's own `depends_on` only requires
        # `ollama: condition: service_healthy` (the daemon responding), not
        # ollama-init's completion, so the app starts fine with no models
        # pulled — AI features are documented as optional (CLAUDE.md: "ezCompanion
        # is optional at install time") and degrade gracefully without them.
        # docker-compose.yml's ollama/HOST_DATA_PATH/CCD_INBOX_PATH mounts all
        # default to portable, OS-agnostic paths (named volume / repo-local
        # .devdata/ dirs) — no CI-specific overrides needed here anymore.
        run: |
          docker compose -f docker-compose.yml up -d postgres minio ollama flyway app

      - name: Wait for app readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/login.html > /dev/null; then
              echo "App is up after ${i} attempt(s)"
              exit 0
            fi
            echo "Waiting for app... (${i}/60)"
            sleep 5
          done
          echo "App did not become ready in time"
          docker compose -f docker-compose.yml logs app --tail 200
          exit 1

      - name: Run Playwright suite
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Dump app logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs app --tail 500
